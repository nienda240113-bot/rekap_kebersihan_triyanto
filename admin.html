<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Monitoring Foto Toko</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  color:#222;
}

.header{
  background:#1677ff;
  color:white;
  padding:20px 15px;
  text-align:center;
}

.header h1{
  margin:0 0 6px;
  font-size:22px;
}

.header p{
  margin:0;
  opacity:.9;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}

.summary-box{
  background:white;
  padding:15px 10px;
  border-radius:12px;
  text-align:center;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.summary-box .angka{
  font-size:28px;
  font-weight:bold;
  margin-top:5px;
}

.control{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

select,
button{
  width:100%;
  padding:12px;
  border-radius:9px;
  font-size:16px;
}

select{
  border:1px solid #ccc;
  background:white;
}

button{
  margin-top:10px;
  border:0;
  background:#1677ff;
  color:white;
  font-weight:bold;
}

button:disabled{
  background:#999;
}

.toko-list{
  display:grid;
  gap:12px;
}

.toko{
  background:white;
  border-radius:14px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.toko-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.nama{
  font-size:18px;
  font-weight:bold;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.sudah{
  background:#dcfce7;
  color:#166534;
}

.belum{
  background:#fee2e2;
  color:#991b1b;
}

.foto-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:12px;
}

.foto-grid img{
  width:100%;
  height:130px;
  object-fit:cover;
  border-radius:8px;
}

.info{
  margin-top:10px;
  font-size:13px;
  color:#666;
}

.kosong{
  margin-top:12px;
  padding:15px;
  text-align:center;
  background:#f9fafb;
  border-radius:8px;
  color:#888;
}

.loading{
  background:white;
  padding:25px;
  text-align:center;
  border-radius:12px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}

@media(max-width:600px){

  .summary{
    grid-template-columns:repeat(3,1fr);
  }

  .summary-box{
    padding:12px 5px;
    font-size:12px;
  }

  .summary-box .angka{
    font-size:22px;
  }

  .foto-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .foto-grid img{
    height:140px;
  }

}
</style>
</head>

<body>

<div class="header">

<h1>📊 ADMIN MONITORING TOKO</h1>

<p>Rekap Upload Foto Kebersihan</p>

</div>

<div class="container">

<div class="summary">

<div class="summary-box">
Total Toko
<div class="angka" id="total">20</div>
</div>

<div class="summary-box">
Sudah
<div class="angka" id="sudah">0</div>
</div>

<div class="summary-box">
Belum
<div class="angka" id="belum">20</div>
</div>

</div>


<div class="control">

<select id="filter" onchange="tampilkan()">

<option value="">📋 Semua Toko</option>

<option value="C624">C624 / RWBT</option>
<option value="C560">C560 / RAJ</option>
<option value="CH81">CH81 / CDKS</option>
<option value="CG76">CG76 / SPMM</option>
<option value="C573">C573 / GMM</option>
<option value="CE47">CE47 / MKRI</option>
<option value="CI30">CI30 / STTD</option>
<option value="CH41">CH41 / KPMRK</option>
<option value="CG54">CG54 / MM2100</option>
<option value="C935">C935 / TLJ2</option>
<option value="CA71">CA71 / WSGN</option>
<option value="C965">C965 / CBNU</option>
<option value="CG86">CG86 / JKST</option>
<option value="CA94">CA94 / KPTI</option>
<option value="C574">C574 / SKU</option>
<option value="CI15">CI15 / RPSU</option>
<option value="CI54">CI54 / RJLB</option>
<option value="CF50">CF50 / DNIA</option>
<option value="CC21">CC21 / KUTN</option>
<option value="CI84">CI84 / TLKW</option>

</select>

<button id="refresh" onclick="ambilData()">
🔄 REFRESH DATA
</button>

</div>


<div id="pesan" class="loading">
⏳ Membaca database...
</div>

<div id="tokoList" class="toko-list"></div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbznlq75doudRBOjvBju0KCt7eSQ5f0mi_FHUd7780bvAKwl_RncH6QG38fA_dT8kR6y/exec";


const TOKO = [

["C624","RWBT"],
["C560","RAJ"],
["CH81","CDKS"],
["CG76","SPMM"],
["C573","GMM"],
["CE47","MKRI"],
["CI30","STTD"],
["CH41","KPMRK"],
["CG54","MM2100"],
["C935","TLJ2"],
["CA71","WSGN"],
["C965","CBNU"],
["CG86","JKST"],
["CA94","KPTI"],
["C574","SKU"],
["CI15","RPSU"],
["CI54","RJLB"],
["CF50","DNIA"],
["CC21","KUTN"],
["CI84","TLKW"]

];


let dataFoto = [];


/* ================================
   AMBIL DATABASE
================================ */

async function ambilData(){

  const pesan =
    document.getElementById("pesan");

  const tombol =
    document.getElementById("refresh");

  tombol.disabled = true;

  pesan.className = "loading";

  pesan.innerHTML =
    "⏳ Mengambil data terbaru...";

  try{

    const response =
      await fetch(
        API +
        "?admin=1&t=" +
        Date.now()
      );

    const hasil =
      await response.json();

    if(hasil.status !== "success"){

      throw new Error(
        hasil.message ||
        "Database tidak dapat dibaca"
      );

    }

    dataFoto =
      hasil.data || [];

    hitung();

    tampilkan();

    pesan.style.display = "none";

  }catch(error){

    pesan.className = "error";

    pesan.style.display = "block";

    pesan.innerHTML =
      "❌ Gagal membaca database<br><br>" +
      error.message;

  }

  tombol.disabled = false;

}


/* ================================
   HITUNG STATUS
================================ */

function hitung(){

  const kodeUpload =
    new Set(
      dataFoto.map(
        x => x.kodeToko
      )
    );

  let sudah = 0;

  TOKO.forEach(toko => {

    if(
      kodeUpload.has(toko[0])
    ){
      sudah++;
    }

  });

  document.getElementById(
    "total"
  ).innerText = TOKO.length;

  document.getElementById(
    "sudah"
  ).innerText = sudah;

  document.getElementById(
    "belum"
  ).innerText =
    TOKO.length - sudah;

}


/* ================================
   TAMPILKAN
================================ */

function tampilkan(){

  const list =
    document.getElementById(
      "tokoList"
    );

  const filter =
    document.getElementById(
      "filter"
    ).value;

  list.innerHTML = "";


  TOKO.forEach(toko => {

    const kode = toko[0];
    const nama = toko[1];

    if(
      filter &&
      filter !== kode
    ){
      return;
    }


    const foto =
      dataFoto.filter(
        x =>
        x.kodeToko === kode
      );


    const card =
      document.createElement(
        "div"
      );

    card.className = "toko";


    let isiFoto = "";

    if(foto.length){

      const fotoTerbaru =
        foto
          .slice()
          .reverse()
          .slice(0,6);


      isiFoto =
        "<div class='foto-grid'>";

      fotoTerbaru.forEach(item => {

        isiFoto += `
          <img
            src="${item.fileUrl}"
            loading="lazy"
            onclick="window.open('${item.fileUrl}','_blank')"
          >
        `;

      });

      isiFoto += "</div>";


    }else{

      isiFoto =
        "<div class='kosong'>" +
        "📷 Belum ada foto" +
        "</div>";

    }


    const waktu =
      foto.length
      ? formatTanggal(
          foto[foto.length-1].timestamp
        )
      : "-";


    card.innerHTML = `

      <div class="toko-head">

        <div class="nama">
          ${kode} / ${nama}
        </div>

        <div class="status ${
          foto.length
          ? "sudah"
          : "belum"
        }">

          ${
            foto.length
            ? "🟢 SUDAH"
            : "🔴 BELUM"
          }

        </div>

      </div>

      ${isiFoto}

      <div class="info">
        ${foto.length
          ? "🕐 Upload terakhir: " + waktu
          : "Belum melakukan upload"
        }
      </div>

    `;


    list.appendChild(card);

  });

}


/* ================================
   FORMAT WAKTU
================================ */

function formatTanggal(
  tanggal
){

  if(!tanggal){
    return "-";
  }

  return new Date(
    tanggal
  ).toLocaleString(
    "id-ID",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


/* ================================
   JALANKAN
================================ */

ambilData();

</script>

</body>
   </html>
