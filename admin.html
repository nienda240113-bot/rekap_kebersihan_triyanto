<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Kebersihan Triyanto</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:#0f766e;
color:white;
padding:18px 12px;
text-align:center;
}

header h1{
margin:0 0 5px;
font-size:20px;
}

header p{
margin:3px;
font-size:13px;
}

.container{
max-width:1000px;
margin:auto;
padding:12px;
}

.panel{
background:white;
border-radius:14px;
padding:14px;
margin-bottom:14px;
box-shadow:0 2px 8px #0001;
}

input{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:9px;
font-size:15px;
}

button{
width:100%;
border:0;
border-radius:9px;
padding:13px;
margin-top:8px;
font-weight:bold;
font-size:14px;
}

.btn-blue{
background:#2563eb;
color:white;
}

.btn-purple{
background:#7c3aed;
color:white;
}

.btn-green{
background:#16a34a;
color:white;
}

.btn-orange{
background:#ea580c;
color:white;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
}

.summary-box{
background:white;
border-radius:12px;
padding:12px;
text-align:center;
box-shadow:0 2px 8px #0001;
}

.number{
font-size:23px;
font-weight:bold;
}

.label{
font-size:11px;
margin-top:4px;
}

.progress-box{
background:white;
padding:14px;
border-radius:12px;
margin:14px 0;
box-shadow:0 2px 8px #0001;
}

.progress{
height:14px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#0f766e;
}

.progress-text{
text-align:center;
font-weight:bold;
margin-top:6px;
}

.loading{
text-align:center;
padding:30px;
font-weight:bold;
}

.error{
background:#fee2e2;
color:#991b1b;
padding:14px;
border-radius:10px;
font-weight:bold;
}

/* =================================
   GRID PER TOKO
================================= */

.store{
background:white;
border-radius:14px;
padding:12px;
margin-bottom:14px;
box-shadow:0 2px 8px #0001;
}

.store-title{
font-weight:bold;
font-size:17px;
margin-bottom:8px;
}

.store-status{
font-size:13px;
margin-bottom:8px;
}

.photo-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:4px;
}

.photo-grid img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
border-radius:5px;
cursor:pointer;
}

/* =================================
   FRAME GABUNGAN
================================= */

.frame{
background:white;
border-radius:14px;
padding:10px;
margin-top:14px;
box-shadow:0 2px 8px #0001;
}

.frame-title{
text-align:center;
font-size:18px;
font-weight:bold;
margin-bottom:3px;
}

.frame-date{
text-align:center;
font-size:12px;
margin-bottom:10px;
}

.combined-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:5px;
}

.store-card{
background:#e5e7eb;
border-radius:4px;
overflow:hidden;
}

.store-card img{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
display:block;
}

.store-info{
background:rgba(0,0,0,.72);
color:white;
font-size:10px;
padding:5px;
font-weight:bold;
text-align:center;
}

.frame-footer{
text-align:center;
font-size:10px;
margin-top:8px;
color:#475569;
}

</style>
</head>


<body>


<header>

<h1>ADMIN REKAP KEBERSIHAN</h1>

<p>AREA : TRIYANTO</p>

<p>TOKO PIC : KUTN</p>

</header>


<div class="container">


<div class="panel">

<b>📅 Pilih Tanggal</b>

<br><br>

<input
id="tanggal"
type="date">

<button
class="btn-blue"
onclick="loadData()">

🔄 REFRESH DATA

</button>

<button
class="btn-purple"
onclick="buatSemuaGrid()">

📸 TAMPILKAN GRID PER TOKO

</button>

<button
class="btn-orange"
onclick="buatFrameGabungan()">

🖼️ BUAT 1 FRAME SEMUA TOKO

</button>

<button
class="btn-green"
onclick="bagikanFrame()">

📲 BAGIKAN FRAME KE WHATSAPP

</button>

</div>


<div class="summary">

<div class="summary-box">

<div
id="total"
class="number">

20

</div>

<div class="label">
TOTAL TOKO
</div>

</div>


<div class="summary-box">

<div
id="sudah"
class="number">

0

</div>

<div class="label">
SUDAH KIRIM
</div>

</div>


<div class="summary-box">

<div
id="belum"
class="number">

20

</div>

<div class="label">
BELUM KIRIM
</div>

</div>

</div>


<div class="progress-box">

<b>📊 PROGRESS</b>

<br><br>

<div class="progress">

<div
id="bar"
class="bar">
</div>

</div>

<div
id="persen"
class="progress-text">

0%

</div>

</div>


<div
id="frameArea">
</div>


<div
id="hasil">

<div class="loading">

⏳ Memuat database...

</div>

</div>


</div>


<script>


/* =================================
   APPS SCRIPT DEPLOYMENT
================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxWjPI9_Oej-tHG2xXq-VFveR6ksWqikXZZLORqDJVw73apm9EUV6tEc2xpYWkL98y5/exec";


/* =================================
   20 TOKO
================================= */

const TOKO = [

["C624","RWBT"],
["C560","RAJ"],
["CH81","CDKS"],
["CG76","SPMM"],
["C573","GMM"],
["CE47","MKRI"],
["CI30","STTD"],
["CH41","KPMRK"],
["CG54","MM2100"],
["C935","TLJ2"],
["CA71","WSGN"],
["C965","CBNU"],
["CG86","JKST"],
["CA94","KPTI"],
["C574","SKU"],
["CI15","RPSU"],
["CI54","RJLB"],
["CF50","DNIA"],
["CC21","KUTN"],
["CI84","TLKW"]

];


let DATA = [];

let frameCanvas = null;


/* =================================
   TANGGAL HARI INI
================================= */

const now =
new Date();

document.getElementById(
"tanggal"
).value =

now.getFullYear() +
"-" +
String(
now.getMonth()+1
).padStart(2,"0") +
"-" +
String(
now.getDate()
).padStart(2,"0");


/* =================================
   LOAD DATABASE
================================= */

async function loadData(){

document.getElementById(
"hasil"
).innerHTML =

`
<div class="loading">
⏳ Mengambil data...
</div>
`;


try{

const response =
await fetch(
API_URL +
"?action=rekap"
);


const result =
await response.json();


if(!result.success){

throw new Error(
result.message ||
"Database gagal dibaca"
);

}


DATA =
result.data || [];


updateSummary();


}catch(error){

document.getElementById(
"hasil"
).innerHTML =

`
<div class="error">

❌ ERROR DATABASE

<br><br>

${error.message}

</div>
`;

}

}


/* =================================
   DATA SESUAI TANGGAL
================================= */

function dataTanggal(){

const tanggal =
document.getElementById(
"tanggal"
).value;


return DATA.filter(
function(item){

return String(
item.tanggal
).substring(0,10)
===
tanggal;

});

}


/* =================================
   UPDATE SUMMARY
================================= */

function updateSummary(){

const data =
dataTanggal();


const kodeSudah =
new Set(
data.map(
function(item){

return item.kodeToko;

})
);


const jumlah =
kodeSudah.size;


const persen =
Math.round(
(jumlah / 20) * 100
);


document.getElementById(
"total"
).textContent =
20;


document.getElementById(
"sudah"
).textContent =
jumlah;


document.getElementById(
"belum"
).textContent =
20 - jumlah;


document.getElementById(
"bar"
).style.width =
persen + "%";


document.getElementById(
"persen"
).textContent =
persen + "%";

}


/* =================================
   CARI TOKO
================================= */

function cariToko(
kode,
data
){

return data
.filter(
function(item){

return item.kodeToko ===
kode;

})
.pop();

}


/* =================================
   AMBIL FOTO
================================= */

function ambilFoto(
item
){

if(!item){

return [];

}


return [

item.foto1,
item.foto2,
item.foto3,
item.foto4,
item.foto5,
item.foto6

].filter(
function(url){

return url &&
url !== "undefined" &&
url !== "null";

});

}


/* =================================
   GRID PER TOKO
================================= */

function buatSemuaGrid(){

const data =
dataTanggal();


const hasil =
document.getElementById(
"hasil"
);


hasil.innerHTML = "";


TOKO.forEach(
function(toko,index){

const kode =
toko[0];

const nama =
toko[1];


const item =
cariToko(
kode,
data
);


const foto =
ambilFoto(item);


const div =
document.createElement(
"div"
);

div.className =
"store";


let html =

`
<div class="store-title">

${index+1}. ${kode} / ${nama}

</div>
`;


if(foto.length){

html +=

`
<div class="store-status">
✅ ${foto.length} foto
</div>

<div class="photo-grid">
`;


foto.forEach(
function(url){

html +=

`
<img
src="${url}"
onclick="window.open('${url}','_blank')">
`;

});


html +=
`</div>`;

}else{

html +=

`
<div class="store-status">

❌ BELUM MENGIRIM

</div>
`;

}


div.innerHTML =
html;


hasil.appendChild(
div
);

});

}


/* =================================
   BUAT FRAME GABUNGAN
================================= */

function buatFrameGabungan(){

const data =
dataTanggal();


const tokoKirim =
[];


TOKO.forEach(
function(toko){

const item =
cariToko(
toko[0],
data
);


const foto =
ambilFoto(item);


if(foto.length){

tokoKirim.push({

kode:toko[0],

nama:toko[1],

foto:foto[0]

});

}

});


if(!tokoKirim.length){

alert(
"Belum ada toko yang mengirim foto."
);

return;

}


const tanggal =
document.getElementById(
"tanggal"
).value;


const area =
document.getElementById(
"frameArea"
);


area.innerHTML =

`
<div class="frame">

<div class="frame-title">

🖼️ REKAP FOTO TOKO

</div>

<div class="frame-date">

AREA TRIYANTO • ${tanggal}

</div>

<div
id="combinedGrid"
class="combined-grid">
</div>

<div class="frame-footer">

${tokoKirim.length} TOKO SUDAH KIRIM

</div>

</div>
`;


const grid =
document.getElementById(
"combinedGrid"
);


tokoKirim.forEach(
function(toko,index){

const card =
document.createElement(
"div"
);

card.className =
"store-card";


card.innerHTML =

`
<img
src="${toko.foto}">

<div class="store-info">

${index+1}. ${toko.kode}/${toko.nama}

</div>
`;


grid.appendChild(
card
);

});


buatCanvasFrame(
tokoKirim,
tanggal
);


area.scrollIntoView({
behavior:"smooth"
});

}


/* =================================
   CANVAS FRAME
================================= */

async function buatCanvasFrame(
tokoKirim,
tanggal
){

const cols = 4;

const cell = 500;

const rows =
Math.ceil(
tokoKirim.length /
cols
);


const canvas =
document.createElement(
"canvas"
);


canvas.width =
cols * cell;


canvas.height =
rows * cell;


const ctx =
canvas.getContext(
"2d"
);


ctx.fillStyle =
"#ffffff";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


for(
let i=0;
i<tokoKirim.length;
i++
){

const toko =
tokoKirim[i];


const x =
(i % cols) *
cell;

const y =
Math.floor(i / cols) *
cell;


try{

await gambarCanvas(
ctx,
toko.foto,
x,
y,
cell,
cell
);

}catch(e){

ctx.fillStyle =
"#e5e7eb";

ctx.fillRect(
x,
y,
cell,
cell
);

}


ctx.fillStyle =
"rgba(0,0,0,.72)";

ctx.fillRect(
x,
y+cell-65,
cell,
65
);


ctx.fillStyle =
"#ffffff";

ctx.font =
"bold 26px Arial";

ctx.textAlign =
"center";

ctx.fillText(
`${i+1}. ${toko.kode}/${toko.nama}`,
x+cell/2,
y+cell-25
);

ctx.textAlign =
"left";

}


frameCanvas =
canvas;

}


/* =================================
   FOTO KE CANVAS
================================= */

function gambarCanvas(
ctx,
url,
x,
y,
w,
h
){

return new Promise(
function(resolve,reject){

const img =
new Image();


img.crossOrigin =
"anonymous";


img.onload =
function(){

const scale =
Math.max(
w/img.width,
h/img.height
);


const nw =
img.width *
scale;


const nh =
img.height *
scale;


const dx =
x+(w-nw)/2;


const dy =
y+(h-nh)/2;


ctx.save();

ctx.beginPath();

ctx.rect(
x,
y,
w,
h
);

ctx.clip();


ctx.drawImage(
img,
dx,
dy,
nw,
nh
);


ctx.restore();


resolve();

};


img.onerror =
function(){

reject();

};


img.src =
url;

});

}


/* =================================
   BAGIKAN FRAME
================================= */

async function bagikanFrame(){

if(!frameCanvas){

alert(
"Tekan BUAT 1 FRAME SEMUA TOKO terlebih dahulu."
);

return;

}


frameCanvas.toBlob(
async function(blob){

const file =
new File(
[blob],
"REKAP_FOTO_TRIYANTO.png",
{
type:"image/png"
}
);


if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

try{

await navigator.share({

title:
"Rekap Foto Kebersihan",

text:
"Rekap Foto Kebersihan Area Triyanto",

files:[
file
]

});

}catch(error){

console.log(error);

}

}else{

downloadFrame();

}

},
"image/png"
);

}


/* =================================
   DOWNLOAD FRAME
================================= */

function downloadFrame(){

if(!frameCanvas){

return;

}


const a =
document.createElement(
"a"
);


a.download =
"REKAP_FOTO_TRIYANTO.png";


a.href =
frameCanvas.toDataURL(
"image/png"
);


a.click();

}


/* =================================
   TANGGAL BERUBAH
================================= */

document.getElementById(
"tanggal"
).addEventListener(
"change",
function(){

updateSummary();

document.getElementById(
"hasil"
).innerHTML = "";

document.getElementById(
"frameArea"
).innerHTML = "";

frameCanvas = null;

});


/* =================================
   MULAI
================================= */

loadData();

</script>

</body>
</html>
