<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Rekap Kebersihan</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f3f6;
  color:#222;
}

.header{
  background:#1677ff;
  color:white;
  padding:18px 15px;
  text-align:center;
}

.header h2{
  margin:0;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.panel{
  background:white;
  padding:15px;
  border-radius:14px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:9px;
  background:#1677ff;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button.green{
  background:#16a34a;
}

button.gray{
  background:#555;
}

select,input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.summary div{
  background:white;
  padding:12px 5px;
  text-align:center;
  border-radius:10px;
}

.angka{
  display:block;
  font-size:24px;
  font-weight:bold;
}

.toko{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.tokoHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sudah{
  color:#15803d;
  font-weight:bold;
}

.belum{
  color:#b91c1c;
  font-weight:bold;
}

.foto{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:10px;
}

.foto img{
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:6px;
}

#loading{
  text-align:center;
  padding:20px;
}

#gridPreview{
  width:100%;
  display:block;
  margin-top:10px;
  border-radius:10px;
}

@media(max-width:600px){
  .foto{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="header">
<h2>📊 ADMIN REKAP KEBERSIHAN</h2>
<div>Monitoring 20 Toko</div>
</div>

<div class="container">

<div class="summary">

<div>
Total
<span class="angka" id="total">20</span>
</div>

<div>
Sudah
<span class="angka" id="sudah">0</span>
</div>

<div>
Belum
<span class="angka" id="belum">20</span>
</div>

</div>

<div class="panel">

<label><b>Tanggal Rekap</b></label>

<input
type="date"
id="tanggal"
>

<button onclick="ambilData()">
🔄 REFRESH DATA
</button>

<button
class="green"
onclick="buatGrid()"
>
📸 BUAT GRID WHATSAPP
</button>

<button
class="gray"
onclick="bagikanWhatsApp()"
>
📤 BAGIKAN KE WHATSAPP
</button>

</div>

<div class="panel">

<div id="loading">
⏳ Membaca database...
</div>

<div id="list"></div>

</div>

<div class="panel">

<h3>📸 PREVIEW GRID</h3>

<canvas
id="canvas"
style="display:none"
></canvas>

<img
id="gridPreview"
style="display:none"
>

</div>

</div>


<script>

const API =
"https://script.google.com/macros/s/AKfycbznlq75doudRBOjvBju0KCt7eSQ5f0mi_FHUd7780bvAKwl_RncH6QG38fA_dT8kR6y/exec";


const TOKO=[

["C624","RWBT"],
["C560","RAJ"],
["CH81","CDKS"],
["CG76","SPMM"],
["C573","GMM"],
["CE47","MKRI"],
["CI30","STTD"],
["CH41","KPMRK"],
["CG54","MM2100"],
["C935","TLJ2"],
["CA71","WSGN"],
["C965","CBNU"],
["CG86","JKST"],
["CA94","KPTI"],
["C574","SKU"],
["CI15","RPSU"],
["CI54","RJLB"],
["CF50","DNIA"],
["CC21","KUTN"],
["CI84","TLKW"]

];


let database=[];


/* =====================================
   SET TANGGAL HARI INI
===================================== */

document.getElementById("tanggal").value =
new Date().toISOString().slice(0,10);


/* =====================================
   AMBIL DATA
===================================== */

async function ambilData(){

document.getElementById("loading").innerHTML =
"⏳ Membaca database...";

try{

const response =
await fetch(
API+"?admin=1&t="+Date.now()
);

const hasil =
await response.json();

if(hasil.status!=="success"){

throw new Error(
hasil.message || "Gagal membaca database"
);

}

database=hasil.data || [];

tampilkan();

}catch(error){

document.getElementById("loading").innerHTML =
"❌ "+error.message;

}

}


/* =====================================
   TAMPILKAN
===================================== */

function tampilkan(){

const tanggal =
document.getElementById("tanggal").value;

const list =
document.getElementById("list");

list.innerHTML="";

let sudah=0;


/*
Ambil data sesuai tanggal
*/

const dataTanggal =
database.filter(item=>{

if(!item.timestamp){
return false;
}

const d =
new Date(item.timestamp);

const lokal =
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

return lokal===tanggal;

});


TOKO.forEach(toko=>{

const kode=toko[0];
const nama=toko[1];

const foto =
dataTanggal.filter(
x=>x.kodeToko===kode
);

if(foto.length){
sudah++;
}


let html=`

<div class="toko">

<div class="tokoHead">

<b>${kode} / ${nama}</b>

<span class="${
foto.length ? "sudah":"belum"
}">

${
foto.length
? "🟢 SUDAH"
: "🔴 BELUM"
}

</span>

</div>
`;


if(foto.length){

html+=`
<div class="foto">
`;

foto.slice(-6).forEach(item=>{

html+=`
<img
src="${item.fileUrl}"
loading="lazy"
>
`;

});

html+=`
</div>
`;

}else{

html+=`
<div style="
padding:12px;
color:#999;
text-align:center;
">
Belum upload foto
</div>
`;

}


html+=`
</div>
`;

list.innerHTML+=html;

});


document.getElementById("total").innerText =
TOKO.length;

document.getElementById("sudah").innerText =
sudah;

document.getElementById("belum").innerText =
TOKO.length-sudah;

document.getElementById("loading").innerHTML =
"";


}


/* =====================================
   BUAT GRID
===================================== */

async function buatGrid(){

const tanggal =
document.getElementById("tanggal").value;

if(!tanggal){

alert("Pilih tanggal terlebih dahulu");

return;

}


const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");


const COL=4;
const ROW=5;

const W=300;
const H=250;

const HEADER=130;

canvas.width =
COL*W;

canvas.height =
HEADER+(ROW*H);


ctx.fillStyle="#ffffff";

ctx.fillRect(
0,0,
canvas.width,
canvas.height
);


/* HEADER */

ctx.fillStyle="#1677ff";

ctx.fillRect(
0,0,
canvas.width,
HEADER
);


ctx.fillStyle="#ffffff";

ctx.textAlign="center";

ctx.font="bold 30px Arial";

ctx.fillText(
"REKAP AKTIVITAS KEBERSIHAN",
canvas.width/2,
45
);

ctx.font="bold 24px Arial";

ctx.fillText(
"TGL: "+formatTanggalSingkat(tanggal),
canvas.width/2,
82
);

ctx.font="20px Arial";

ctx.fillText(
"AREA: TRIYANTO",
canvas.width/2,
110
);


/* DATA TOKO */

for(
let i=0;
i<TOKO.length;
i++
){

const col =
i%COL;

const row =
Math.floor(i/COL);

const x =
col*W;

const y =
HEADER+(row*H);


ctx.strokeStyle="#cccccc";

ctx.strokeRect(
x,
y,
W,
H
);


ctx.fillStyle="#222";

ctx.textAlign="center";

ctx.font="bold 20px Arial";

ctx.fillText(
TOKO[i][0]+" / "+TOKO[i][1],
x+W/2,
y+28
);


/*
Cari foto pertama
*/

const foto =
database.filter(item=>{

if(
item.kodeToko!==TOKO[i][0]
){
return false;
}

if(!item.timestamp){
return false;
}

const d =
new Date(item.timestamp);

const lokal =
d.getFullYear()+"-"+
String(d.getMonth()+1).padStart(2,"0")+"-"+
String(d.getDate()).padStart(2,"0");

return lokal===tanggal;

});


if(foto.length){

try{

const img =
await loadImage(
foto[foto.length-1].fileUrl
);

ctx.drawImage(
img,
x+10,
y+40,
W-20,
H-55
);

}catch(e){

tulisBelum(
ctx,
x,
y,
W,
H
);

}

}else{

tulisBelum(
ctx,
x,
y,
W,
H
);

}

}


/* PREVIEW */

const preview =
document.getElementById(
"gridPreview"
);

preview.src =
canvas.toDataURL(
"image/jpeg",
0.85
);

preview.style.display="block";


alert(
"✅ Grid berhasil dibuat"
);

}


/* =====================================
   LOAD IMAGE
===================================== */

function loadImage(url){

return new Promise(
(resolve,reject)=>{

const img =
new Image();

img.crossOrigin="anonymous";

img.onload=()=>{
resolve(img);
};

img.onerror=()=>{
reject();
};

img.src=url;

}
);

}


/* =====================================
   BELUM
===================================== */

function tulisBelum(
ctx,
x,
y,
w,
h
){

ctx.fillStyle="#eeeeee";

ctx.fillRect(
x+10,
y+40,
w-20,
h-55
);

ctx.fillStyle="#999";

ctx.font="bold 20px Arial";

ctx.textAlign="center";

ctx.fillText(
"BELUM UPLOAD",
x+w/2,
y+h/2
);

}


/* =====================================
   BAGIKAN WHATSAPP
===================================== */

async function bagikanWhatsApp(){

const preview =
document.getElementById(
"gridPreview"
);


if(
preview.style.display==="none"
){

alert(
"Buat GRID terlebih dahulu."
);

return;

}


/*
Web Share API
*/

try{

const blob =
await (
await fetch(
preview.src
)
).blob();


const file =
new File(
[blob],
"rekap_kebersihan.jpg",
{
type:"image/jpeg"
}
);


if(
navigator.share &&
navigator.canShare &&
navigator.canShare({
files:[file]
})
){

await navigator.share({

files:[file],

title:
"Rekap Aktivitas Kebersihan",

text:
"Rekap Aktivitas Kebersihan Toko"

});

}else{

/*
Fallback
*/

const link =
document.createElement("a");

link.href =
preview.src;

link.download =
"rekap_kebersihan.jpg";

link.click();


alert(
"Grid sudah dibuat. Jika menu berbagi tidak muncul, gambar sudah disiapkan untuk disimpan lalu dikirim ke WhatsApp."
);

}

}catch(error){

console.log(error);

}

}


/* =====================================
   FORMAT TANGGAL
===================================== */

function formatTanggalSingkat(tanggal){

const d =
new Date(tanggal+"T00:00:00");

return String(
d.getDate()
).padStart(2,"0")+
"-"+
String(
d.getMonth()+1
).padStart(2,"0")+
"-"+
d.getFullYear();

}


/* =====================================
   START
===================================== */

ambilData();

</script>

</body>
  </html>
