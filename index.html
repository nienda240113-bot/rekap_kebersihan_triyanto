<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Rekap Kebersihan Triyanto</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

header{
  background:#0f766e;
  color:white;
  padding:18px 14px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:5px 0;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:12px;
}

.info,
.progress-box,
.store{
  background:white;
  border-radius:14px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.info b{
  display:block;
  margin-bottom:7px;
}

input[type=date]{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}

.store-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.store-title h3{
  margin:0;
  font-size:17px;
}

.status{
  font-size:22px;
}

.photo-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.photo-buttons button{
  border:0;
  border-radius:10px;
  padding:13px 5px;
  font-size:14px;
  font-weight:bold;
  color:white;
}

.camera-btn{
  background:#2563eb;
}

.gallery-btn{
  background:#7c3aed;
}

.count{
  margin-top:10px;
  font-size:13px;
  font-weight:bold;
}

.preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.preview-item{
  position:relative;
}

.preview-item img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
}

.remove-photo{
  position:absolute;
  right:4px;
  top:4px;
  width:26px;
  height:26px;
  border:0;
  border-radius:50%;
  background:#dc2626;
  color:white;
  font-weight:bold;
  font-size:18px;
  padding:0;
}

.save{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:12px;
  background:#0f766e;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.save:disabled{
  background:#94a3b8;
}

.whatsapp{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  margin-top:8px;
  background:#16a34a;
  color:white;
  font-size:15px;
  font-weight:bold;
}

.progress{
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#0f766e;
  transition:.3s;
}

.result{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  padding:14px;
  border-radius:10px;
  color:white;
  text-align:center;
  font-weight:bold;
  display:none;
  z-index:9999;
}

.success{
  background:#16a34a;
}

.error{
  background:#dc2626;
}

.loading{
  background:#2563eb;
}
</style>
</head>

<body>

<header>

<h1>
REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO
</h1>

<p>AREA : TRIYANTO</p>
<p>TOKO PIC : KUTN</p>

</header>


<div class="container">


<div class="info">

<b>Tanggal</b>

<input
id="tanggal"
type="date">

</div>


<div class="progress-box">

<b>Progress Penyimpanan</b>

<div id="progressText">
0 / 20 toko tersimpan
</div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

</div>


<div id="stores"></div>


</div>


<div
id="result"
class="result">
</div>


<script>

/* =========================================
   DATABASE GOOGLE APPS SCRIPT
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzLr5lu9lj-w9r0n9FTGLhtID30fnEAQhMwjhiKePpSrhfVP1OLKyFh3P5-y3BHmSSR/exec";


/* =========================================
   DAFTAR TOKO
========================================= */

const TOKO = [

["C624","RWBT"],
["C560","RAJ"],
["CH81","CDKS"],
["CG76","SPMM"],
["C573","GMM"],
["CE47","MKRI"],
["CI30","STTD"],
["CH41","KPMRK"],
["CG54","MM2100"],
["C935","TLJ2"],
["CA71","WSGN"],
["C965","CBNU"],
["CG86","JKST"],
["CA94","KPTI"],
["C574","SKU"],
["CI15","RPSU"],
["CI54","RJLB"],
["CF50","DNIA"],
["CC21","KUTN"],
["CI84","TLKW"]

];


/* =========================================
   PENYIMPANAN FOTO
========================================= */

const FOTO_TOKO = {};

const savedStores = new Set();


/* =========================================
   TANGGAL OTOMATIS
========================================= */

const now = new Date();

document.getElementById("tanggal").value =
now.getFullYear() +
"-" +
String(now.getMonth()+1).padStart(2,"0") +
"-" +
String(now.getDate()).padStart(2,"0");


/* =========================================
   PESAN
========================================= */

function showMessage(text,type){

  const el =
  document.getElementById("result");

  el.textContent = text;

  el.className =
  "result " + type;

  el.style.display = "block";

  if(type !== "loading"){

    setTimeout(function(){

      el.style.display = "none";

    },4000);

  }
}


/* =========================================
   MEMBUAT DAFTAR TOKO
========================================= */

function renderStores(){

  const container =
  document.getElementById("stores");

  container.innerHTML = "";


  TOKO.forEach(function(toko,index){

    const kode = toko[0];

    const nama = toko[1];

    FOTO_TOKO[kode] = [];


    const div =
    document.createElement("div");

    div.className = "store";


    div.innerHTML = `

      <div class="store-title">

        <h3>
          ${index+1}. ${kode}/${nama}
        </h3>

        <span
        class="status"
        id="status-${kode}">
          ⏳
        </span>

      </div>


      <div class="photo-buttons">

        <button
        type="button"
        class="camera-btn"
        onclick="bukaKamera('${kode}')">

          📷 Ambil Foto

        </button>


        <button
        type="button"
        class="gallery-btn"
        onclick="bukaGaleri('${kode}')">

          🖼️ Pilih dari Galeri

        </button>

      </div>


      <input
      type="file"
      id="kamera-${kode}"
      accept="image/*"
      capture="environment"
      hidden>


      <input
      type="file"
      id="galeri-${kode}"
      accept="image/*"
      multiple
      hidden>


      <div
      class="count"
      id="count-${kode}">

        Belum ada foto — wajib 3–6 foto

      </div>


      <div
      class="preview"
      id="preview-${kode}">
      </div>


      <button
      class="save"
      id="save-${kode}"
      onclick="simpanToko('${kode}','${nama}')">

        💾 SIMPAN ONLINE

      </button>


      <button
      class="whatsapp"
      onclick="shareWhatsApp('${kode}','${nama}')">

        📲 KIRIM WHATSAPP

      </button>

    `;


    container.appendChild(div);


    document
    .getElementById(`kamera-${kode}`)
    .addEventListener(
      "change",
      function(){

        tambahFoto(
          kode,
          this.files
        );

        this.value = "";

      }
    );


    document
    .getElementById(`galeri-${kode}`)
    .addEventListener(
      "change",
      function(){

        tambahFoto(
          kode,
          this.files
        );

        this.value = "";

      }
    );

  });

}


/* =========================================
   KAMERA
========================================= */

function bukaKamera(kode){

  document
  .getElementById(`kamera-${kode}`)
  .click();

}


/* =========================================
   GALERI
========================================= */

function bukaGaleri(kode){

  document
  .getElementById(`galeri-${kode}`)
  .click();

}


/* =========================================
   TAMBAH FOTO
========================================= */

function tambahFoto(kode,files){

  const daftar =
  FOTO_TOKO[kode];


  for(
    let i=0;
    i<files.length;
    i++
  ){

    if(daftar.length >= 6){

      showMessage(
        "Maksimal 6 foto",
        "error"
      );

      break;

    }


    if(
      files[i].type.startsWith("image/")
    ){

      daftar.push(files[i]);

    }

  }


  renderPreview(kode);

}


/* =========================================
   PREVIEW
========================================= */

function renderPreview(kode){

  const daftar =
  FOTO_TOKO[kode];


  const preview =
  document.getElementById(
    `preview-${kode}`
  );


  const count =
  document.getElementById(
    `count-${kode}`
  );


  preview.innerHTML = "";


  if(daftar.length === 0){

    count.textContent =
    "Belum ada foto — wajib 3–6 foto";

    count.style.color =
    "#dc2626";

    return;

  }


  if(daftar.length < 3){

    count.textContent =
    `⚠️ ${daftar.length} foto — minimal 3`;

    count.style.color =
    "#dc2626";

  }else{

    count.textContent =
    `✅ ${daftar.length} foto siap disimpan`;

    count.style.color =
    "#16a34a";

  }


  daftar.forEach(
    function(file,index){

      const item =
      document.createElement("div");

      item.className =
      "preview-item";


      const img =
      document.createElement("img");


      const reader =
      new FileReader();


      reader.onload =
      function(e){

        img.src =
        e.target.result;

      };


      reader.readAsDataURL(file);


      const remove =
      document.createElement("button");

      remove.className =
      "remove-photo";

      remove.textContent =
      "×";


      remove.onclick =
      function(){

        FOTO_TOKO[kode].splice(
          index,
          1
        );

        renderPreview(kode);

      };


      item.appendChild(img);

      item.appendChild(remove);

      preview.appendChild(item);

    }
  );

}


/* =========================================
   KOMPRES FOTO
========================================= */

function resizeImage(file){

  return new Promise(
    function(resolve,reject){

      const reader =
      new FileReader();


      reader.onload =
      function(e){

        const img =
        new Image();


        img.onload =
        function(){

          const maxWidth = 1200;

          let width =
          img.width;

          let height =
          img.height;


          if(width > maxWidth){

            height =
            height *
            maxWidth /
            width;

            width =
            maxWidth;

          }


          const canvas =
          document.createElement(
            "canvas"
          );


          canvas.width =
          width;

          canvas.height =
          height;


          const ctx =
          canvas.getContext("2d");


          ctx.drawImage(
            img,
            0,
            0,
            width,
            height
          );


          resolve(
            canvas.toDataURL(
              "image/jpeg",
              0.70
            )
          );

        };


        img.onerror = reject;

        img.src =
        e.target.result;

      };


      reader.onerror = reject;

      reader.readAsDataURL(file);

    }
  );

}


/* =========================================
   SIMPAN ONLINE
========================================= */

async function simpanToko(kode,nama){

  const files =
  FOTO_TOKO[kode];


  const button =
  document.getElementById(
    `save-${kode}`
  );


  const status =
  document.getElementById(
    `status-${kode}`
  );


  if(!files || files.length < 3){

    showMessage(
      `${kode}/${nama}: minimal 3 foto`,
      "error"
    );

    return;

  }


  if(files.length > 6){

    showMessage(
      `${kode}/${nama}: maksimal 6 foto`,
      "error"
    );

    return;

  }


  const tanggal =
  document.getElementById(
    "tanggal"
  ).value;


  if(!tanggal){

    showMessage(
      "Tanggal belum dipilih",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent =
  "⏳ MENYIMPAN...";

  status.textContent =
  "⏳";


  showMessage(
    `Mengirim ${kode}/${nama}...`,
    "loading"
  );


  try{

    const foto = [];


    for(
      let i=0;
      i<files.length;
      i++
    ){

      const hasil =
      await resizeImage(
        files[i]
      );

      foto.push(hasil);

    }


    const data = {

      tanggal: tanggal,

      area: "TRIYANTO",

      tokoPic: "KUTN",

      kodeToko: kode,

      namaToko: nama,

      status: "✅",

      foto: foto

    };


    /*
      KIRIM KE GOOGLE APPS SCRIPT

      no-cors digunakan supaya browser
      tidak memblokir koneksi.
    */

    await fetch(
      API_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:
        JSON.stringify(data)
      }
    );


    /*
      Request sudah terkirim.
    */

    status.textContent =
    "✅";


    button.textContent =
    "✅ DATA TERKIRIM";


    button.style.background =
    "#16a34a";


    savedStores.add(kode);


    updateProgress();


    showMessage(
      `${kode}/${nama} berhasil dikirim ke database`,
      "success"
    );


  }catch(error){

    console.error(error);


    status.textContent =
    "❌";


    button.disabled =
    false;


    button.textContent =
    "💾 COBA SIMPAN LAGI";


    showMessage(
      `${kode}/${nama}: ${error.message}`,
      "error"
    );

  }

}


/* =========================================
   PROGRESS
========================================= */

function updateProgress(){

  const jumlah =
  savedStores.size;


  document.getElementById(
    "progressText"
  ).textContent =
  `${jumlah} / 20 toko tersimpan`;


  document.getElementById(
    "progressBar"
  ).style.width =
  `${jumlah / 20 * 100}%`;

}


/* =========================================
   WHATSAPP
========================================= */

function shareWhatsApp(kode,nama){

  const tanggal =
  document.getElementById(
    "tanggal"
  ).value;


  const jumlah =
  FOTO_TOKO[kode].length;


  const text =

`*REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO*

*AREA : TRIYANTO*
*PER TGL : ${tanggal}*
*TOKO PIC : KUTN*

${kode}/${nama}/✅

Jumlah foto: ${jumlah} foto`;


  const url =
  "https://wa.me/?text=" +
  encodeURIComponent(text);


  window.open(
    url,
    "_blank"
  );

}


/* =========================================
   MULAI APLIKASI
========================================= */

renderStores();

</script>

</body>
</html>
