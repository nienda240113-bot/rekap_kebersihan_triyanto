<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Upload Foto Toko</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f2f2f2;
  margin:0;
  padding:15px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 12px #ccc;
}

h2{
  text-align:center;
}

label{
  display:block;
  font-weight:bold;
  margin-top:15px;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  padding:13px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#1677ff;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button:disabled{
  background:#999;
}

#preview{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:15px;
}

#preview img{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:8px;
}

#status{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  text-align:center;
}
</style>
</head>

<body>

<div class="box">

<h2>📸 LAPORAN FOTO TOKO</h2>

<label>Pilih Toko</label>

<select id="toko">

<option value="">-- Pilih Toko --</option>

<option value="C624|RWBT">C624 / RWBT</option>
<option value="C560|RAJ">C560 / RAJ</option>
<option value="CH81|CDKS">CH81 / CDKS</option>
<option value="CG76|SPMM">CG76 / SPMM</option>
<option value="C573|GMM">C573 / GMM</option>
<option value="CE47|MKRI">CE47 / MKRI</option>
<option value="CI30|STTD">CI30 / STTD</option>
<option value="CH41|KPMRK">CH41 / KPMRK</option>
<option value="CG54|MM2100">CG54 / MM2100</option>
<option value="C935|TLJ2">C935 / TLJ2</option>
<option value="CA71|WSGN">CA71 / WSGN</option>
<option value="C965|CBNU">C965 / CBNU</option>
<option value="CG86|JKST">CG86 / JKST</option>
<option value="CA94|KPTI">CA94 / KPTI</option>
<option value="C574|SKU">C574 / SKU</option>
<option value="CI15|RPSU">CI15 / RPSU</option>
<option value="CI54|RJLB">CI54 / RJLB</option>
<option value="CF50|DNIA">CF50 / DNIA</option>
<option value="CC21|KUTN">CC21 / KUTN</option>
<option value="CI84|TLKW">CI84 / TLKW</option>

</select>

<label>Pilih Foto</label>

<input
type="file"
id="foto"
accept="image/*"
multiple
>

<div id="preview"></div>

<div id="status"></div>

<button id="upload" onclick="kirimFoto()">
📤 UPLOAD FOTO
</button>

</div>

<script>

const API =
"https://script.google.com/macros/s/AKfycbznlq75doudRBOjvBju0KCt7eSQ5f0mi_FHUd7780bvAKwl_RncH6QG38fA_dT8kR6y/exec";


/* PREVIEW */

document.getElementById("foto")
.addEventListener("change",function(){

const preview =
document.getElementById("preview");

preview.innerHTML="";

for(const file of this.files){

const img =
document.createElement("img");

img.src =
URL.createObjectURL(file);

preview.appendChild(img);

}

});


/* UPLOAD */

async function kirimFoto(){

const toko =
document.getElementById("toko").value;

const files =
document.getElementById("foto").files;

const tombol =
document.getElementById("upload");

const status =
document.getElementById("status");


if(!toko){

status.innerHTML =
"⚠️ Pilih toko terlebih dahulu";

return;

}


if(files.length===0){

status.innerHTML =
"⚠️ Pilih foto terlebih dahulu";

return;

}


const dataToko =
toko.split("|");

const kodeToko =
dataToko[0];

const namaToko =
dataToko[1];


tombol.disabled=true;

status.innerHTML =
"⏳ Sedang mengupload...";


let sukses=0;

let gagal=0;


for(const file of files){

try{

const base64 =
await bacaFoto(file);


const data={

kodeToko:kodeToko,

namaToko:namaToko,

namaFile:
kodeToko+"_"+Date.now()+"_"+file.name,

mimeType:file.type,

foto:base64

};


const response =
await fetch(API,{

method:"POST",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:JSON.stringify(data)

});


const hasil =
await response.json();


if(hasil.status==="success"){

sukses++;

}else{

gagal++;

}

}catch(error){

console.log(error);

gagal++;

}

}


tombol.disabled=false;


if(gagal===0){

status.innerHTML =
"✅ Berhasil upload "+
sukses+
" foto toko "+
kodeToko;

document.getElementById("foto").value="";

document.getElementById("preview").innerHTML="";

}else{

status.innerHTML =
"⚠️ Berhasil: "+
sukses+
" | Gagal: "+
gagal;

}

}


/* BACA FOTO */

function bacaFoto(file){

return new Promise(function(resolve,reject){

const reader =
new FileReader();

reader.onload=function(){

const hasil =
reader.result;

resolve(
hasil.split(",")[1]
);

};

reader.onerror=reject;

reader.readAsDataURL(file);

});

}

</script>

</body>
</html>
