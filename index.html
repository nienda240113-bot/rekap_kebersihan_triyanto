<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview WhatsApp - Grid 20 Toko</title>
<style>
:root {
  --primary: #1677ff;
  --whatsapp: #25d366;
  --whatsapp-hover: #1ebe5d;
  --bg-color: #f5f7fa;
  --card-bg: #ffffff;
  --text-main: #333333;
  --border-color: #d9d9d9;
}
body {
  font-family: Arial, sans-serif;
  background: var(--bg-color);
  margin: 0;
  padding: 10px;
  color: var(--text-main);
}
.box {
  max-width: 600px;
  margin: auto;
  background: var(--card-bg);
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}
h3.title {
  margin-top: 0;
  font-size: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sub-desc {
  font-size: 11px;
  color: #666;
  margin-bottom: 12px;
}

/* Kotak Statistik Atas */
.stats-container {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  margin-bottom: 15px;
  text-align: center;
}
.stat-box {
  background: #fafafa;
  border: 1px solid #e8e8e8;
  border-radius: 6px;
  padding: 6px 2px;
}
.stat-num {
  font-size: 13px;
  font-weight: bold;
  color: #222;
}
.stat-label {
  font-size: 9px;
  color: #666;
  margin-top: 2px;
}

/* Area Grid Preview */
.grid-preview-box {
  border: 2px dashed #d9d9d9;
  border-radius: 10px;
  padding: 10px;
  background: #fff;
  margin-bottom: 15px;
}
.grid-20-preview {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.toko-card {
  border: 1px solid #e8e8e8;
  border-radius: 6px;
  overflow: hidden;
  background: #fff;
  font-size: 9px;
  text-align: center;
}
.toko-card img {
  width: 100%;
  height: 50px;
  object-fit: cover;
  display: block;
  background: #eee;
}
.toko-card .info {
  padding: 3px 2px;
}
.toko-card .name {
  font-weight: bold;
  font-size: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toko-card .status {
  font-size: 7px;
  color: #52c41a;
  margin-top: 1px;
}

/* Form Input Standar */
label { display: block; font-weight: bold; margin-top: 10px; margin-bottom: 4px; font-size: 12px; }
select, input[type="file"] {
  width: 100%;
  padding: 10px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 13px;
  background: #fafafa;
}
#preview-upload {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}
#preview-upload img {
  width: 100%;
  height: 80px;
  object-fit: cover;
  border-radius: 6px;
}

/* Tombol Aksi Bawah */
.action-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 15px;
}
.btn {
  padding: 10px;
  border: 0;
  border-radius: 6px;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: white;
}
.btn-primary { background: #1677ff; }
.btn-wa { background: var(--whatsapp); }
.btn-wa:hover { background: var(--whatsapp-hover); }
.btn-success { background: #52c41a; }
.btn-dark { background: #333; }

#status {
  margin-top: 10px;
  padding: 8px;
  border-radius: 6px;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  display: none;
}
.status-info { background: #e6f4ff; color: #0958d9; }
.status-success { background: #f6ffed; color: #52c41a; }
.status-error { background: #fff2f0; color: #ff4d4f; }
</style>
</head>
<body>

<div class="box">
  <h3 class="title">💬 Preview WhatsApp</h3>
  <div class="sub-desc">Grid selalu berisi 20 toko. Toko yang belum mengirim foto tetap ditampilkan.</div>

  <!-- Kotak Statistik Atas -->
  <div class="stats-container">
    <div class="stat-box"><div class="stat-num" id="st-total">20</div><div class="stat-label">Total Toko</div></div>
    <div class="stat-box"><div class="stat-num" id="st-sudah">0</div><div class="stat-label">Sudah Kirim</div></div>
    <div class="stat-box"><div class="stat-num" id="st-belum">20</div><div class="stat-label">Belum Kirim</div></div>
    <div class="stat-box"><div class="stat-num" id="st-lengkap">0</div><div class="stat-label">Lengkap</div></div>
    <div class="stat-box"><div class="stat-num" id="st-foto">0</div><div class="stat-label">Total Foto</div></div>
  </div>

  <!-- Tampilan Visual Grid 20 Toko -->
  <div class="grid-preview-box">
    <div id="grid-visual-20" class="grid-20-preview">
      <!-- Diisi otomatis oleh JavaScript -->
    </div>
  </div>

  <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">

  <!-- Form Upload Toko Aktif -->
  <label for="toko">Pilih Toko untuk Upload Foto</label>
  <select id="toko" onchange="simpanPilihanToko()">
    <option value="">-- Pilih Toko --</option>
    <option value="C624|RWBT">1. C624 / RWBT</option>
    <option value="C560|RAJ">2. C560 / RAJ</option>
    <option value="CH81|CDKS">3. CH81 / CDKS</option>
    <option value="CG76|SPMM">4. CG76 / SPMM</option>
    <option value="C573|GMM">5. C573 / GMM</option>
    <option value="CE47|MKRI">6. CE47 / MKRI</option>
    <option value="CI30|STTD">7. CI30 / STTD</option>
    <option value="CH41|KPMRK">8. CH41 / KPMRK</option>
    <option value="CG54|MM2100">9. CG54 / MM2100</option>
    <option value="C935|TLJ2">10. C935 / TLJ2</option>
    <option value="CA71|WSGN">11. CA71 / WSGN</option>
    <option value="C965|CBNU">12. C965 / CBNU</option>
    <option value="CG86|JKST">13. CG86 / JKST</option>
    <option value="CA94|KPTI">14. CA94 / KPTI</option>
    <option value="C574|SKU">15. C574 / SKU</option>
    <option value="CI15|RPSU">16. CI15 / RPSU</option>
    <option value="CI54|RJLB">17. CI54 / RJLB</option>
    <option value="CF50|DNIA">18. CF50 / DNIA</option>
    <option value="CC21|KUTN">19. CC21 / KUTN</option>
    <option value="CI84|TLKW">20. CI84 / TLKW</option>
  </select>

  <label for="foto">Pilih Foto (Bisa Banyak)</label>
  <input type="file" id="foto" accept="image/*" multiple>

  <div id="preview-upload"></div>
  <div id="status"></div>

  <button class="btn btn-primary" onclick="kirimFoto()" id="btn-upload" style="width:100%; margin-top:12px;">📤 UPLOAD FOTO KE CLOUD</button>

  <!-- Tombol Aksi Bawah -->
  <div class="action-buttons">
    <button class="btn btn-primary" onclick="renderGridVisual()">🔄 Buat / Refresh Grid</button>
    <a href="#" id="btn-wa-grid" target="_blank" class="btn btn-wa">💬 Kirim Grid ke WA</a>
    <button class="btn btn-success" onclick="alert('Fitur simpan grid aktif')">📥 Simpan Grid</button>
    <a href="#" id="btn-wa-rekap" target="_blank" class="btn btn-dark">📋 Kirim Rekap Teks</a>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwmae6m05HhR8Wm5NMFyh2Ocq1T15s6LPd1ky5jIH44UQA7cGnkAYggXunmPt7QM6uP/exec";

const listTokoData = [
  {id: 1, kode: "C624", nama: "RWBT"}, {id: 2, kode: "C560", nama: "RAJ"},
  {id: 3, kode: "CH81", nama: "CDKS"}, {id: 4, kode: "CG76", nama: "SPMM"},
  {id: 5, kode: "C573", nama: "GMM"}, {id: 6, kode: "CE47", nama: "MKRI"},
  {id: 7, kode: "CI30", nama: "STTD"}, {id: 8, kode: "CH41", nama: "KPMRK"},
  {id: 9, kode: "CG54", nama: "MM2100"}, {id: 10, kode: "C935", nama: "TLJ2"},
  {id: 11, kode: "CA71", nama: "WSGN"}, {id: 12, kode: "C965", nama: "CBNU"},
  {id: 13, kode: "CG86", nama: "JKST"}, {id: 14, kode: "CA94", nama: "KPTI"},
  {id: 15, kode: "C574", nama: "SKU"}, {id: 16, kode: "CI15", nama: "RPSU"},
  {id: 17, kode: "CI54", nama: "RJLB"}, {id: 18, kode: "CF50", nama: "DNIA"},
  {id: 19, kode: "CC21", nama: "KUTN"}, {id: 20, kode: "CI84", nama: "TLKW"}
];

window.addEventListener("DOMContentLoaded", () => {
  const savedToko = localStorage.getItem("last_selected_toko");
  if (savedToko) document.getElementById("toko").value = savedToko;
  renderGridVisual();
});

function simpanPilihanToko() {
  const val = document.getElementById("toko").value;
  if (val) localStorage.setItem("last_selected_toko", val);
}

// Render Grid 20 Toko di Layar
function renderGridVisual() {
  const container = document.getElementById("grid-visual-20");
  container.innerHTML = "";

  let totalSudah = 0;
  let totalFoto = 0;

  let rekapTeksWA = `📊 *REKAP FOTO 20 TOKO*\n📅 ${new Date().toLocaleDateString("id-ID")}\n\n`;

  listTokoData.forEach(toko => {
    const dataUpload = JSON.parse(localStorage.getItem(`upload_${toko.kode}`)) || { status: "Belum", jumlah: 0, previewImg: "", links: [] };

    const card = document.createElement("div");
    card.className = "toko-card";

    let imgTag = `<div style="height:50px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#aaa;">No Foto</div>`;
    let statusText = `<span style="color:#faad14;">Belum</span>`;

    if (dataUpload.status === "Sukses") {
      totalSudah++;
      totalFoto += dataUpload.jumlah;
      if (dataUpload.previewImg) {
        imgTag = `<img src="${dataUpload.previewImg}" alt="Foto">`;
      }
      statusText = `LENGKAP • ${dataUpload.jumlah} Foto`;

      rekapTeksWA += `✅ *${toko.id}. ${toko.kode}/${toko.nama}* (${dataUpload.jumlah} Foto)\n`;
      dataUpload.links.forEach(l => { rekapTeksWA += `   🔗 ${l}\n`; });
    } else {
      rekapTeksWA += `⏳ *${toko.id}. ${toko.kode}/${toko.nama}*: Belum Kirim\n`;
    }

    card.innerHTML = `
      ${imgTag}
      <div class="info">
        <div class="name">${toko.id}. ${toko.kode}/${toko.nama}</div>
        <div class="status">${statusText}</div>
      </div>
    `;
    container.appendChild(card);
  });

  // Perbarui Statistik Atas
  document.getElementById("st-total").textContent = "20";
  document.getElementById("st-sudah").textContent = totalSudah;
  document.getElementById("st-belum").textContent = 20 - totalSudah;
  document.getElementById("st-lengkap").textContent = totalSudah;
  document.getElementById("st-foto").textContent = totalFoto;

  // Set link WhatsApp Rekap Teks
  document.getElementById("btn-wa-rekap").href = `https://wa.me/?text=${encodeURIComponent(rekapTeksWA)}`;
  document.getElementById("btn-wa-grid").href = `https://wa.me/?text=${encodeURIComponent("Berikut rekap visual 20 toko:\n" + rekapTeksWA)}`;
}

// Preview foto yang dipilih di form
document.getElementById("foto").addEventListener("change", function() {
  const preview = document.getElementById("preview-upload");
  preview.innerHTML = "";
  for (const file of this.files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.createElement("img");
      img.src = e.target.result;
      preview.appendChild(img);
    }
    reader.readAsDataURL(file);
  }
});

// Proses Upload Foto ke Server & Simpan State Grid
async function kirimFoto() {
  const tokoVal = document.getElementById("toko").value;
  const files = document.getElementById("foto").files;
  const tombol = document.getElementById("btn-upload");

  if (!tokoVal) { tampilStatus("⚠️ Pilih toko terlebih dahulu", "error"); return; }
  if (files.length === 0) { tampilStatus("⚠️ Pilih foto terlebih dahulu", "error"); return; }

  const [kodeToko, namaToko] = tokoVal.split("|");
  tombol.disabled = true;
  let sukses = 0, gagal = 0;
  let listLinkDrive = [];
  let thumbnailPertama = "";

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    tampilStatus(`⏳ Mengompres & Mengupload (${i + 1}/${files.length})...`, "info");

    try {
      const base64Compressed = await kompresDanUbahKeBase64(file, 800, 0.5);
      if (i === 0) thumbnailPertama = `data:image/jpeg;base64,${base64Compressed}`;

      const payload = {
        kodeToko: kodeToko,
        namaToko: namaToko,
        namaFile: `${kodeToko}_${Date.now()}_${file.name}`,
        mimeType: "image/jpeg",
        foto: base64Compressed
      };

      const response = await fetch(API, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const textRes = await response.text();
      let hasil = JSON.parse(textRes);

      if (hasil.status === "success") {
        sukses++;
        if (hasil.link) listLinkDrive.push(hasil.link);
      } else {
        gagal++;
      }
    } catch (error) {
      console.error(error);
      gagal++;
    }
  }

  tombol.disabled = false;

  if (gagal === 0) {
    tampilStatus(`✅ Berhasil upload ${sukses} foto toko ${kodeToko}`, "success");
    
    // Simpan ke memori lokal browser agar grid otomatis terisi kotak gambarnya
    localStorage.setItem(`upload_${kodeToko}`, JSON.stringify({
      status: "Sukses",
      jumlah: sukses,
      previewImg: thumbnailPertama,
      links: listLinkDrive
    }));

    renderGridVisual(); // Refresh tampilan grid 20 toko di atas
    document.getElementById("foto").value = "";
    document.getElementById("preview-upload").innerHTML = "";
  } else {
    tampilStatus(`⚠️ Berhasil: ${sukses} | Gagal: ${gagal}`, "error");
  }
}

function kompresDanUbahKeBase64(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

function tampilStatus(pesan, jenis) {
  const status = document.getElementById("status");
  status.className = `status-${jenis}`;
  status.style.display = "block";
  status.innerHTML = pesan;
}
</script>

</body>
</html>
