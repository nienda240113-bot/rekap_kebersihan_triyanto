<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Foto Toko - Rekap 20 Toko</title>
<style>
:root {
  --primary: #1677ff;
  --primary-hover: #0958d9;
  --whatsapp: #25d366;
  --whatsapp-hover: #1ebe5d;
  --bg-color: #f5f7fa;
  --card-bg: #ffffff;
  --text-main: #333333;
  --border-color: #d9d9d9;
}
body {
  font-family: Arial, sans-serif;
  background: var(--bg-color);
  margin: 0;
  padding: 15px;
  color: var(--text-main);
}
.box {
  max-width: 500px;
  margin: 20px auto;
  background: var(--card-bg);
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}
h2 { text-align: center; color: #1f1f1f; }
label { display: block; font-weight: bold; margin-top: 15px; margin-bottom: 6px; font-size: 14px; }
select, input[type="file"] {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  font-size: 15px;
  background: #fafafa;
}
button {
  width: 100%;
  padding: 15px;
  margin-top: 15px;
  border: 0;
  border-radius: 10px;
  background: var(--primary);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
button:disabled { background: #999; cursor: not-allowed; }

.btn-wa {
  background: var(--whatsapp);
  text-decoration: none;
  display: block;
  text-align: center;
  padding: 15px;
  margin-top: 10px;
  border-radius: 10px;
  color: white;
  font-size: 16px;
  font-weight: bold;
  box-sizing: border-box;
}
.btn-wa:hover { background: var(--whatsapp-hover); }

#preview {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 15px;
}
.preview-item {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  background: #000;
}
#preview img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  display: block;
}
.file-name {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 10px;
  padding: 3px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-size: 14px;
  font-weight: bold;
  display: none;
}
.status-info { background: #e6f4ff; color: #0958d9; border: 1px solid #91caff; display: block; }
.status-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.status-error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }

#wa-section {
  margin-top: 20px;
  display: none;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  padding: 15px;
  border-radius: 10px;
}
#wa-section h3 {
  margin-top: 0;
  font-size: 15px;
  color: #166534;
}
#wa-preview-box {
  width: 100%;
  height: 130px;
  padding: 10px;
  box-sizing: border-box;
  border: 1px solid #86efac;
  border-radius: 8px;
  font-family: monospace;
  font-size: 12px;
  background: #ffffff;
  resize: vertical;
}

/* Bagian Tabel Rekap 20 Toko */
.rekap-container {
  margin-top: 30px;
  background: #ffffff;
  border: 1px solid var(--border-color);
  padding: 15px;
  border-radius: 12px;
}
.rekap-container h3 {
  margin-top: 0;
  font-size: 16px;
  border-bottom: 2px solid #eee;
  padding-bottom: 8px;
}
.toko-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #f0f0f0;
  font-size: 14px;
}
.toko-info {
  font-weight: bold;
}
.toko-status {
  font-size: 12px;
  color: #888;
}
.btn-wa-mini {
  background: var(--whatsapp);
  color: white;
  padding: 6px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 12px;
  font-weight: bold;
}
</style>
</head>
<body>

<div class="box">
  <h2>📸 LAPORAN FOTO TOKO</h2>

  <label for="toko">Pilih Toko</label>
  <select id="toko" onchange="simpanPilihanToko()">
    <option value="">-- Pilih Toko --</option>
    <option value="C624|RWBT">C624 / RWBT</option>
    <option value="C560|RAJ">C560 / RAJ</option>
    <option value="CH81|CDKS">CH81 / CDKS</option>
    <option value="CG76|SPMM">CG76 / SPMM</option>
    <option value="C573|GMM">C573 / GMM</option>
    <option value="CE47|MKRI">CE47 / MKRI</option>
    <option value="CI30|STTD">CI30 / STTD</option>
    <option value="CH41|KPMRK">CH41 / KPMRK</option>
    <option value="CG54|MM2100">CG54 / MM2100</option>
    <option value="C935|TLJ2">C935 / TLJ2</option>
    <option value="CA71|WSGN">CA71 / WSGN</option>
    <option value="C965|CBNU">C965 / CBNU</option>
    <option value="CG86|JKST">CG86 / JKST</option>
    <option value="CA94|KPTI">CA94 / KPTI</option>
    <option value="C574|SKU">C574 / SKU</option>
    <option value="CI15|RPSU">CI15 / RPSU</option>
    <option value="CI54|RJLB">CI54 / RJLB</option>
    <option value="CF50|DNIA">CF50 / DNIA</option>
    <option value="CC21|KUTN">CC21 / KUTN</option>
    <option value="CI84|TLKW">CI84 / TLKW</option>
  </select>

  <label for="foto">Pilih Foto</label>
  <input type="file" id="foto" accept="image/*" multiple>

  <div id="preview"></div>
  <div id="status"></div>

  <button id="upload" onclick="kirimFoto()">📤 UPLOAD FOTO</button>
  
  <!-- Kotak Preview WhatsApp Terakhir -->
  <div id="wa-section">
    <h3>💬 Preview Pesan WhatsApp (Upload Terakhir):</h3>
    <textarea id="wa-preview-box" readonly></textarea>
    <a id="btn-wa-link" href="#" target="_blank" class="btn-wa">📱 KIRIM LANGSUNG KE WHATSAPP</a>
  </div>

  <!-- Daftar Rekap 20 Toko di Layar -->
  <div class="rekap-container">
    <h3>📋 Daftar 20 Toko & Status Laporan</h3>
    <div id="daftar-toko-list">
      <!-- Daftar toko akan digenerate otomatis -->
    </div>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwmae6m05HhR8Wm5NMFyh2Ocq1T15s6LPd1ky5jIH44UQA7cGnkAYggXunmPt7QM6uP/exec";

// Daftar lengkap 20 toko
const listTokoData = [
  {kode: "C624", nama: "RWBT"}, {kode: "C560", nama: "RAJ"},
  {kode: "CH81", nama: "CDKS"}, {kode: "CG76", nama: "SPMM"},
  {kode: "C573", nama: "GMM"}, {kode: "CE47", nama: "MKRI"},
  {kode: "CI30", nama: "STTD"}, {kode: "CH41", nama: "KPMRK"},
  {kode: "CG54", nama: "MM2100"}, {kode: "C935", nama: "TLJ2"},
  {kode: "CA71", nama: "WSGN"}, {kode: "C965", nama: "CBNU"},
  {kode: "CG86", nama: "JKST"}, {kode: "CA94", nama: "KPTI"},
  {kode: "C574", nama: "SKU"}, {kode: "CI15", nama: "RPSU"},
  {kode: "CI54", nama: "RJLB"}, {kode: "CF50", nama: "DNIA"},
  {kode: "CC21", nama: "KUTN"}, {kode: "CI84", nama: "TLKW"}
];

window.addEventListener("DOMContentLoaded", () => {
  const savedToko = localStorage.getItem("last_selected_toko");
  if (savedToko) document.getElementById("toko").value = savedToko;
  muatDaftarRekapToko();
});

function simpanPilihanToko() {
  const val = document.getElementById("toko").value;
  if (val) localStorage.setItem("last_selected_toko", val);
}

// Fungsi render daftar 20 toko ke layar
function muatDaftarRekapToko() {
  const container = document.getElementById("daftar-toko-list");
  container.innerHTML = "";

  listTokoData.forEach(toko => {
    const historyUpload = JSON.parse(localStorage.getItem(`upload_${toko.kode}`)) || { status: "Belum Upload", links: [] };

    const row = document.createElement("div");
    row.className = "toko-row";
    
    let statusText = `<span style="color: #999;">Belum Upload</span>`;
    let actionBtn = `<span class="toko-status">-</span>`;

    if (historyUpload.status === "Sukses") {
      statusText = `<span style="color: #52c41a; font-weight:bold;">✅ ${historyUpload.jumlah} Foto Terkirim</span>`;
      
      let pesanToko = `*LAPORAN FOTO TOKO*\n`;
      pesanToko += `📍 Toko: ${toko.kode} / ${toko.nama}\n`;
      pesanToko += `📸 Jumlah Foto: ${historyUpload.jumlah} File\n\n`;
      pesanToko += `*Link Arsip Foto:*\n`;
      historyUpload.links.forEach((l, idx) => {
        pesanToko += `${idx + 1}. ${l}\n`;
      });

      const encodedMsg = encodeURIComponent(pesanToko);
      actionBtn = `<a href="https://wa.me/?text=${encodedMsg}" target="_blank" class="btn-wa-mini">📱 Kirim WA</a>`;
    }

    row.innerHTML = `
      <div>
        <div class="toko-info">${toko.kode} / ${toko.nama}</div>
        <div class="toko-status">${statusText}</div>
      </div>
      <div>${actionBtn}</div>
    `;
    container.appendChild(row);
  });
}

document.getElementById("foto").addEventListener("change", function() {
  const preview = document.getElementById("preview");
  preview.innerHTML = "";
  document.getElementById("wa-section").style.display = "none";
  for (const file of this.files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const container = document.createElement("div");
      container.className = "preview-item";
      container.innerHTML = `<img src="${e.target.result}"><div class="file-name">${file.name}</div>`;
      preview.appendChild(container);
    }
    reader.readAsDataURL(file);
  }
});

async function kirimFoto() {
  const tokoVal = document.getElementById("toko").value;
  const files = document.getElementById("foto").files;
  const tombol = document.getElementById("upload");

  if (!tokoVal) { tampilStatus("⚠️ Pilih toko terlebih dahulu", "error"); return; }
  if (files.length === 0) { tampilStatus("⚠️ Pilih foto terlebih dahulu", "error"); return; }

  const [kodeToko, namaToko] = tokoVal.split("|");
  tombol.disabled = true;
  let sukses = 0, gagal = 0;
  let listLinkDrive = [];

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    tampilStatus(`⏳ Mengompres & Mengupload (${i + 1}/${files.length})...`, "info");

    try {
      const base64Compressed = await kompresDanUbahKeBase64(file, 900, 0.5);
      const payload = {
        kodeToko: kodeToko,
        namaToko: namaToko,
        namaFile: `${kodeToko}_${Date.now()}_${file.name}`,
        mimeType: "image/jpeg",
        foto: base64Compressed
      };

      const response = await fetch(API, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const textRes = await response.text();
      let hasil = JSON.parse(textRes);

      if (hasil.status === "success") {
        sukses++;
        if (hasil.link) listLinkDrive.push(hasil.link);
      } else {
        gagal++;
      }
    } catch (error) {
      console.error(error);
      gagal++;
    }
  }

  tombol.disabled = false;

  if (gagal === 0) {
    tampilStatus(`✅ Berhasil upload ${sukses} foto toko ${kodeToko}`, "success");
    
    // Simpan ke memori lokal browser agar langsung tampil di tabel rekap 20 toko
    localStorage.setItem(`upload_${kodeToko}`, JSON.stringify({
      status: "Sukses",
      jumlah: sukses,
      links: listLinkDrive
    }));
    muatDaftarRekapToko(); // Refresh tabel daftar toko otomatis

    // Susun format teks laporan untuk WhatsApp
    const tanggalHariIni = new Date().toLocaleDateString("id-ID", {dateStyle: "full"});
    let teksPesan = `*LAPORAN FOTO TOKO*\n`;
    teksPesan += `📅 Tanggal: ${tanggalHariIni}\n`;
    teksPesan += `📍 Toko: ${kodeToko} / ${namaToko}\n`;
    teksPesan += `📸 Jumlah Foto: ${sukses} File\n\n`;
    teksPesan += `*Link Arsip Foto:*\n`;
    listLinkDrive.forEach((link, idx) => {
      teksPesan += `${idx + 1}. ${link}\n`;
    });
    teksPesan += `\nStatus: ✅ Sukses & Terkirim`;

    document.getElementById("wa-preview-box").value = teksPesan;
    const waLink = document.getElementById("btn-wa-link");
    waLink.href = `https://wa.me/?text=${encodeURIComponent(teksPesan)}`;
    
    document.getElementById("wa-section").style.display = "block";
    document.getElementById("foto").value = "";
  } else {
    tampilStatus(`⚠️ Berhasil: ${sukses} | Gagal: ${gagal}`, "error");
  }
}

function kompresDanUbahKeBase64(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

function tampilStatus(pesan, jenis) {
  const status = document.getElementById("status");
  status.className = `status-${jenis}`;
  status.innerHTML = pesan;
}
</script>

</body>
</html>
