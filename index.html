<script>
const API = "https://script.google.com/macros/s/AKfycbzrR02hYWX2lncc1E3uSh712Py6NB5oXiS0No0dzaWFjwyUCNAvvMPBZKicVufV87dE/exec";

const listTokoData = [
  {id: 1, kode: "C624", nama: "RWBT"}, {id: 2, kode: "C560", nama: "RAJ"},
  {id: 3, kode: "CH81", nama: "CDKS"}, {id: 4, kode: "CG76", nama: "SPMM"},
  {id: 5, kode: "C573", nama: "GMM"}, {id: 6, kode: "CE47", nama: "MKRI"},
  {id: 7, kode: "CI30", nama: "STTD"}, {id: 8, kode: "CH41", nama: "KPMRK"},
  {id: 9, kode: "CG54", nama: "MM2100"}, {id: 10, kode: "C935", nama: "TLJ2"},
  {id: 11, kode: "CA71", nama: "WSGN"}, {id: 12, kode: "C965", nama: "CBNU"},
  {id: 13, kode: "CG86", nama: "JKST"}, {id: 14, kode: "CA94", nama: "KPTI"},
  {id: 15, kode: "C574", nama: "SKU"}, {id: 16, kode: "CI15", nama: "RPSU"},
  {id: 17, kode: "CI54", nama: "RJLB"}, {id: 18, kode: "CF50", nama: "DNIA"},
  {id: 19, kode: "CC21", nama: "KUTN"}, {id: 20, kode: "CI84", nama: "TLKW"}
];

window.addEventListener("DOMContentLoaded", () => {
  const savedToko = localStorage.getItem("last_selected_toko");
  if (savedToko) document.getElementById("toko").value = savedToko;
  
  cekDanResetOtomatisTanggal();

  // Munculkan panduan otomatis jika baru pertama kali buka hari ini
  if (!localStorage.getItem("sudah_panduan_hari_ini")) {
    setTimeout(mulaiPanduan, 1000);
  }
});

// Sistem Tour Guide Animasi
let currentStep = 0;
const tourSteps = [
  { element: "step-1-container", title: "Langkah 1: Pilih Toko 📍", text: "Ketuk menu pilihan ini dan cari atau pilih nama/kode toko Anda sebelum mengupload foto." },
  { element: "step-2-container", title: "Langkah 2: Pilih Foto 📷", text: "Pilih foto aktivitas/rak toko Anda. Ketentuan: Minimal 1 foto dan Maksimal 6 foto." },
  { element: "step-3-container", title: "Langkah 3: Upload Kilat ⚡", text: "Ketuk tombol ini untuk memproses dan mengupload foto secara instan ke Cloud & Server pusat." },
  { element: "step-4-container", title: "Langkah 4: Kirim ke WhatsApp 💬", text: "Setelah semua toko lengkap, ketuk tombol hijau ini untuk membagikan rekap Master Grid Ultra HD ke grup WhatsApp!" }
];

function mulaiPanduan() {
  currentStep = 0;
  document.getElementById("tour-overlay").style.display = "flex";
  tampilLangkahTour();
}

function tampilLangkahTour() {
  // Bersihkan highlight sebelumnya
  tourSteps.forEach(step => {
    const el = document.getElementById(step.element);
    if (el) el.classList.remove("highlight-target");
  });

  if (currentStep >= tourSteps.length) {
    tutupPanduan();
    localStorage.setItem("sudah_panduan_hari_ini", "true");
    return;
  }

  const step = tourSteps[currentStep];
  const targetEl = document.getElementById(step.element);
  if (targetEl) {
    targetEl.classList.add("highlight-target");
    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  document.getElementById("tour-title").textContent = step.title;
  document.getElementById("tour-text").textContent = step.text;
  
  const nextBtn = document.getElementById("tour-next-btn");
  if (currentStep === tourSteps.length - 1) {
    nextBtn.textContent = "Selesai ✓";
  } else {
    nextBtn.textContent = "Lanjut ➔";
  }
}

function lanjutPanduan() {
  currentStep++;
  tampilLangkahTour();
}

function tutupPanduan() {
  tourSteps.forEach(step => {
    const el = document.getElementById(step.element);
    if (el) el.classList.remove("highlight-target");
  });
  document.getElementById("tour-overlay").style.display = "none";
  localStorage.setItem("sudah_panduan_hari_ini", "true");
}

async function cekDanResetOtomatisTanggal() {
  const tanggalHariIni = new Date().toISOString().split('T')[0];
  const tanggalTersimpan = localStorage.getItem("app_tanggal_aktif");

  if (tanggalTersimpan !== tanggalHariIni) {
    listTokoData.forEach(toko => {
      localStorage.removeItem(`upload_${toko.kode}`);
    });
    localStorage.setItem("app_tanggal_aktif", tanggalHariIni);

    try {
      await fetch(API, {
        method: "POST",
        body: JSON.stringify({ action: "reset" })
      });
    } catch (err) {
      console.error("Gagal reset otomatis ke server:", err);
    }
  }

  sinkronisasiDataServer();
}

async function sinkronisasiDataServer() {
  tampilStatus("⏳ Menyinkronkan data real-time...", "info");
  try {
    const response = await fetch(API);
    const result = await response.json();
    if (result.status === "success") {
      if (result.data && result.data.length > 0) {
        result.data.forEach(item => {
          localStorage.setItem(`upload_${item.kodeToko}`, JSON.stringify({
            status: "Sukses",
            jumlah: parseInt(item.jumlah) || 1,
            collageImg: item.collageImg || "",
            links: item.links ? item.links.split(",") : []
          }));
        });
      }
      renderGridVisual();
      tampilStatus("✅ Data tersinkron secara real-time.", "success");
      setTimeout(() => { document.getElementById("status").style.display = "none"; }, 1500);
    }
  } catch (error) {
    console.error("Sinkronisasi gagal:", error);
    renderGridVisual();
  }
}

function simpanPilihanToko() {
  const val = document.getElementById("toko").value;
  if (val) localStorage.setItem("last_selected_toko", val);
}

async function buatKolaseThumbnail(base64List) {
  return new Promise((resolve) => {
    if (!base64List || base64List.length === 0) { resolve(""); return; }
    const canvas = document.createElement("canvas");
    canvas.width = 900; 
    canvas.height = 900;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 900, 900);

    let loadedCount = 0;
    const imgObjects = [];

    base64List.forEach((b64, idx) => {
      const img = new Image();
      img.src = b64;
      img.onload = () => {
        imgObjects[idx] = img;
        loadedCount++;
        if (loadedCount === base64List.length) {
          gambarKeCanvasUltra(ctx, imgObjects);
          resolve(canvas.toDataURL("image/jpeg", 0.92));
        }
      };
      img.onerror = () => {
        loadedCount++;
        if (loadedCount === base64List.length) resolve("");
      };
    });
  });
}

function gambarKeCanvasUltra(ctx, imgs) {
  const len = imgs.filter(Boolean).length;
  if (len === 1) {
    ctx.drawImage(imgs[0], 0, 0, 900, 900);
  } else if (len === 2) {
    ctx.drawImage(imgs[0], 0, 0, 450, 900);
    ctx.drawImage(imgs[1], 450, 0, 450, 900);
  } else if (len <= 4) {
    let w = 450, h = 450;
    imgs.forEach((img, i) => {
      let x = (i % 2) * w;
      let y = Math.floor(i / 2) * h;
      ctx.drawImage(img, x, y, w, h);
    });
  } else {
    let w = 300, h = 300;
    imgs.forEach((img, i) => {
      if (i < 9) {
        let x = (i % 3) * w;
        let y = Math.floor(i / 3) * h;
        ctx.drawImage(img, x, y, w, h);
      }
    });
  }
}

function renderGridVisual() {
  const container = document.getElementById("grid-visual-20");
  container.innerHTML = "";

  let totalSudah = 0;
  let totalFoto = 0;
  let rekapTeksWA = "";

  listTokoData.forEach(toko => {
    const dataUpload = JSON.parse(localStorage.getItem(`upload_${toko.kode}`)) || { status: "Belum", jumlah: 0, collageImg: "" };

    const card = document.createElement("div");
    card.className = "toko-card";

    let imgWrapperHtml = `<div style="height:55px; background:#f0f0f0; display:flex; align-items:center; justify-content:center; font-size:8px; color:#aaa;">No Foto</div>`;
    let statusText = `<span style="color:#faad14;">Belum</span>`;

    if (dataUpload.status === "Sukses") {
      totalSudah++;
      totalFoto += dataUpload.jumlah;
      if (dataUpload.collageImg) {
        imgWrapperHtml = `<img src="${dataUpload.collageImg}" alt="Kolase">`;
      }
      statusText = `LENGKAP • ${dataUpload.jumlah} Foto`;
      rekapTeksWA += `✅ *${toko.id}. ${toko.kode}/${toko.nama}* (${dataUpload.jumlah} Foto)\n`;
    } else {
      rekapTeksWA += `⏳ *${toko.id}. ${toko.kode}/${toko.nama}*: Belum Kirim\n`;
    }

    card.innerHTML = `
      <div class="canvas-wrapper">${imgWrapperHtml}</div>
      <div class="info">
        <div class="name">${toko.id}. ${toko.kode}/${toko.nama}</div>
        <div class="status">${statusText}</div>
      </div>
    `;
    container.appendChild(card);
  });

  const progress = Math.round((totalSudah / 20) * 100);

  document.getElementById("st-total").textContent = "20";
  document.getElementById("st-sudah").textContent = totalSudah;
  document.getElementById("st-belum").textContent = 20 - totalSudah;
  document.getElementById("st-lengkap").textContent = totalSudah;
  document.getElementById("st-foto").textContent = totalFoto;

  window.teksLaporanFinal = `📊 *APLIKASI DAILY ACTIVITY AREA TRIYANTO 2O26*\n\n` +
    `📅 ${new Date().toLocaleDateString("id-ID")} ${new Date().toLocaleTimeString("id-ID", {hour: '2-digit', minute:'2-digit'})}\n\n` +
    `🏢 Total Toko : 20\n` +
    `📦 Sudah Kirim : ${totalSudah}\n` +
    `❌ Belum Kirim : ${20 - totalSudah}\n` +
    `✅ Lengkap : ${totalSudah}\n` +
    `⚠️ Belum Sesuai : 0\n` +
    `📷 Total Foto : ${totalFoto}\n` +
    `📈 Progress : ${progress}%\n\n` +
    `━━━━━━━━━━━━━━━\n` +
    `*DAFTAR 20 TOKO*\n` + rekapTeksWA;
}

async function buatMasterGridImageUltraHD() {
  return new Promise((resolve) => {
    const canvas = document.createElement("canvas");
    const cols = 5; const rows = 4;
    const itemWidth = 800; 
    const itemHeight = 920;
    
    canvas.width = cols * itemWidth;
    canvas.height = rows * itemHeight;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let loaded = 0;
    listTokoData.forEach((toko, index) => {
      const dataUpload = JSON.parse(localStorage.getItem(`upload_${toko.kode}`)) || { collageImg: "" };
      const x = (index % cols) * itemWidth;
      const y = Math.floor(index / cols) * itemHeight;

      if (dataUpload.collageImg) {
        const img = new Image();
        img.src = dataUpload.collageImg;
        img.onload = () => {
          ctx.drawImage(img, x + 20, y + 20, itemWidth - 40, itemWidth - 40);
          
          ctx.fillStyle = "#f9f9f9";
          ctx.fillRect(x + 20, y + itemWidth, itemWidth - 40, 95);
          ctx.strokeStyle = "#bbb";
          ctx.lineWidth = 4;
          ctx.strokeRect(x + 20, y + 20, itemWidth - 40, itemWidth + 90);

          ctx.fillStyle = "#000";
          ctx.font = "bold 42px Arial";
          ctx.textAlign = "center";
          ctx.fillText(`${toko.id}. ${toko.kode}/${toko.nama}`, x + (itemWidth / 2), y + itemWidth + 62);

          loaded++;
          if (loaded === 20) resolve(canvas.toDataURL("image/jpeg", 0.95));
        };
        img.onerror = () => {
          gambarKotakKosongUltra(ctx, toko, x, y, itemWidth);
          loaded++;
          if (loaded === 20) resolve(canvas.toDataURL("image/jpeg", 0.95));
        };
      } else {
        gambarKotakKosongUltra(ctx, toko, x, y, itemWidth);
        loaded++;
        if (loaded === 20) resolve(canvas.toDataURL("image/jpeg", 0.95));
      }
    });
  });
}

function gambarKotakKosongUltra(ctx, toko, x, y, itemWidth) {
  ctx.fillStyle = "#f2f2f2";
  ctx.fillRect(x + 20, y + 20, itemWidth - 40, itemWidth - 40);
  ctx.strokeStyle = "#bbb";
  ctx.lineWidth = 4;
  ctx.strokeRect(x + 20, y + 20, itemWidth - 40, itemWidth + 90);

  ctx.fillStyle = "#777";
  ctx.font = "36px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Belum Ada Foto", x + (itemWidth / 2), y + (itemWidth / 2));

  ctx.fillStyle = "#000";
  ctx.font = "bold 42px Arial";
  ctx.fillText(`${toko.id}. ${toko.kode}/${toko.nama}`, x + (itemWidth / 2), y + itemWidth + 62);
}

document.getElementById("foto").addEventListener("change", function() {
  const preview = document.getElementById("preview-upload");
  preview.innerHTML = "";
  
  if (this.files.length < 1) {
    tampilStatus("⚠️ Minimal pilih 1 foto!", "error");
    return;
  }
  if (this.files.length > 6) {
    tampilStatus("⚠️ Maksimal pilih 6 foto!", "error");
    this.value = "";
    return;
  }
  
  tampilStatus("", "info");
  document.getElementById("status").style.display = "none";

  for (const file of this.files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.createElement("img");
      img.src = e.target.result;
      preview.appendChild(img);
    }
    reader.readAsDataURL(file);
  }
});

async function kirimFoto() {
  const tokoVal = document.getElementById("toko").value;
  const files = document.getElementById("foto").files;
  const tombol = document.getElementById("btn-upload");

  if (!tokoVal) { tampilStatus("⚠️ Pilih toko terlebih dahulu", "error"); return; }
  if (files.length < 1) { tampilStatus("⚠️ Minimal harus memilih 1 foto!", "error"); return; }
  if (files.length > 6) { tampilStatus("⚠️ Maksimal hanya boleh memilih 6 foto!", "error"); return; }

  const [kodeToko, namaToko] = tokoVal.split("|");
  tombol.disabled = true;
  tampilStatus(`⚡ Memproses & Mengupload ${files.length} Foto secara Kilat...`, "info");

  let base64Collection = [];
  let listLinkDrive = [];
  let sukses = 0, gagal = 0;

  const uploadPromises = Array.from(files).map(async (file, i) => {
    try {
      const base64Compressed = await kompresDanUbahKeBase64(file, 1400, 0.82);
      base64Collection.push(`data:image/jpeg;base64,${base64Compressed}`);

      const listLinkStr = listLinkDrive.join(",");
      const collageDataUrl = await buatKolaseThumbnail(base64Collection);

      const payload = {
        kodeToko: kodeToko,
        namaToko: namaToko,
        namaFile: `${kodeToko}_${Date.now()}_${i}_${file.name}`,
        mimeType: "image/jpeg",
        foto: base64Compressed,
        jumlahFoto: files.length,
        listLink: listLinkStr,
        collageImg: collageDataUrl
      };

      const response = await fetch(API, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const textRes = await response.text();
      let hasil = JSON.parse(textRes);

      if (hasil.status === "success") {
        sukses++;
        if (hasil.link) listLinkDrive.push(hasil.link);
      } else {
        gagal++;
      }
    } catch (error) {
      console.error(error);
      gagal++;
    }
  });

  await Promise.all(uploadPromises);
  tombol.disabled = false;

  if (gagal === 0) {
    tampilStatus(`✅ Sukses! ${sukses} Foto berhasil di-upload kilat ke Cloud.`, "success");
    
    const finalCollage = await buatKolaseThumbnail(base64Collection);
    localStorage.setItem(`upload_${kodeToko}`, JSON.stringify({
      status: "Sukses",
      jumlah: sukses,
      collageImg: finalCollage,
      links: listLinkDrive
    }));

    renderGridVisual();
    document.getElementById("foto").value = "";
    document.getElementById("preview-upload").innerHTML = "";
  } else {
    tampilStatus(`⚠️ Berhasil: ${sukses} | Gagal: ${gagal}`, "error");
  }
}

function kompresDanUbahKeBase64(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, (width - width)/2, 0, width, height); // Perbaikan posisi render
        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

function tampilStatus(pesan, jenis) {
  const status = document.getElementById("status");
  status.className = `status-${jenis}`;
  status.style.display = "block";
  status.innerHTML = pesan;
}
