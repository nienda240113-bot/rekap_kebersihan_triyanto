<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Rekap Kebersihan Triyanto</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

header{
  background:#0f766e;
  color:white;
  padding:18px 14px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:5px 0 0;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:12px;
}

.info{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.info b{
  display:inline-block;
  margin-bottom:5px;
}

.store{
  background:white;
  border-radius:14px;
  margin-bottom:15px;
  padding:15px;
  box-shadow:0 2px 8px #0001;
}

.store-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.store-title h3{
  margin:0;
  font-size:17px;
}

.status{
  font-size:22px;
}

input[type=file]{
  width:100%;
  margin:8px 0;
}

.preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.preview img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  background:#ddd;
}

.count{
  font-size:13px;
  margin-top:6px;
  font-weight:bold;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  background:#0f766e;
  color:white;
  margin-top:10px;
}

.save:disabled{
  background:#94a3b8;
}

.whatsapp{
  background:#16a34a;
  color:white;
  margin-top:10px;
}

.result{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  padding:14px;
  border-radius:10px;
  color:white;
  text-align:center;
  font-weight:bold;
  display:none;
  z-index:999;
}

.success{
  background:#16a34a;
}

.error{
  background:#dc2626;
}

.loading{
  background:#2563eb;
}

.top{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
}

.progress{
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#0f766e;
  transition:.3s;
}
</style>
</head>

<body>

<header>
<h1>REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO</h1>
<p>AREA : TRIYANTO</p>
<p>TOKO PIC : KUTN</p>
</header>

<div class="container">

<div class="info">
  <b>Tanggal</b>
  <input id="tanggal" type="date">
</div>

<div class="top">
  <b>Progress Penyimpanan</b>
  <div id="progressText">0 / 20 toko tersimpan</div>
  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>
</div>

<div id="stores"></div>

</div>

<div id="result" class="result"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzyrkzoISeGTCSffRNOAtn8Dt_xfEJVxH6qdi49grTXhf9Fyge5groxSk07cZ8zV4rN/exec";

const TOKO = [
["C624","RWBT"],
["C560","RAJ"],
["CH81","CDKS"],
["CG76","SPMM"],
["C573","GMM"],
["CE47","MKRI"],
["CI30","STTD"],
["CH41","KPMRK"],
["CG54","MM2100"],
["C935","TLJ2"],
["CA71","WSGN"],
["C965","CBNU"],
["CG86","JKST"],
["CA94","KPTI"],
["C574","SKU"],
["CI15","RPSU"],
["CI54","RJLB"],
["CF50","DNIA"],
["CC21","KUTN"],
["CI84","TLKW"]
];

let savedCount = 0;

const today = new Date();

document.getElementById("tanggal").value =
  today.getFullYear() + "-" +
  String(today.getMonth()+1).padStart(2,"0") + "-" +
  String(today.getDate()).padStart(2,"0");


function showMessage(text,type){

  const el =
    document.getElementById("result");

  el.textContent = text;

  el.className =
    "result " + type;

  el.style.display = "block";

  if(type !== "loading"){
    setTimeout(()=>{
      el.style.display="none";
    },4000);
  }
}


function renderStores(){

  const container =
    document.getElementById("stores");

  container.innerHTML = "";

  TOKO.forEach((toko,index)=>{

    const kode = toko[0];
    const nama = toko[1];

    const div =
      document.createElement("div");

    div.className="store";

    div.innerHTML = `

      <div class="store-title">

        <h3>
          ${index+1}. ${kode}/${nama}
        </h3>

        <span
          class="status"
          id="status-${kode}">
          ⏳
        </span>

      </div>

      <input
        type="file"
        id="foto-${kode}"
        accept="image/*"
        capture="environment"
        multiple>

      <div
        class="count"
        id="count-${kode}">
        Pilih 3–6 foto
      </div>

      <div
        class="preview"
        id="preview-${kode}">
      </div>

      <button
        class="save"
        id="save-${kode}"
        onclick="simpanToko('${kode}','${nama}')">

        💾 SIMPAN ONLINE

      </button>

      <button
        class="whatsapp"
        onclick="shareWhatsApp('${kode}','${nama}')">

        📲 KIRIM WHATSAPP

      </button>

    `;

    container.appendChild(div);

    document
      .getElementById(`foto-${kode}`)
      .addEventListener(
        "change",
        function(){

          previewFoto(
            kode,
            this.files
          );

        }
      );

  });

}


function previewFoto(kode,files){

  const preview =
    document.getElementById(
      `preview-${kode}`
    );

  const count =
    document.getElementById(
      `count-${kode}`
    );

  preview.innerHTML="";

  if(files.length < 3){

    count.textContent =
      `⚠️ ${files.length} foto — minimal 3`;

    count.style.color="#dc2626";

  }else if(files.length > 6){

    count.textContent =
      `⚠️ ${files.length} foto — maksimal 6`;

    count.style.color="#dc2626";

  }else{

    count.textContent =
      `✅ ${files.length} foto siap disimpan`;

    count.style.color="#16a34a";

  }

  const jumlah =
    Math.min(files.length,6);

  for(let i=0;i<jumlah;i++){

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        const img =
          document.createElement("img");

        img.src=e.target.result;

        preview.appendChild(img);

      };

    reader.readAsDataURL(files[i]);

  }

}


function resizeImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload =
      function(e){

        const img =
          new Image();

        img.onload =
          function(){

            const maxWidth=1200;

            let width=img.width;
            let height=img.height;

            if(width>maxWidth){

              height =
                height *
                maxWidth /
                width;

              width=maxWidth;

            }

            const canvas =
              document.createElement("canvas");

            canvas.width=width;
            canvas.height=height;

            const ctx =
              canvas.getContext("2d");

            ctx.drawImage(
              img,
              0,
              0,
              width,
              height
            );

            resolve(
              canvas.toDataURL(
                "image/jpeg",
                0.75
              )
            );

          };

        img.onerror=reject;

        img.src=e.target.result;

      };

    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


async function simpanToko(kode,nama){

  const input =
    document.getElementById(
      `foto-${kode}`
    );

  const button =
    document.getElementById(
      `save-${kode}`
    );

  const status =
    document.getElementById(
      `status-${kode}`
    );

  const files =
    Array.from(input.files);

  if(files.length < 3){

    showMessage(
      `${kode}/${nama}: minimal 3 foto`,
      "error"
    );

    return;

  }

  if(files.length > 6){

    showMessage(
      `${kode}/${nama}: maksimal 6 foto`,
      "error"
    );

    return;

  }

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;

  if(!tanggal){

    showMessage(
      "Tanggal belum dipilih",
      "error"
    );

    return;

  }

  button.disabled=true;

  button.textContent =
    "⏳ MENYIMPAN...";

  status.textContent="⏳";

  showMessage(
    `Menyimpan ${kode}/${nama}...`,
    "loading"
  );

  try{

    const foto=[];

    for(let i=0;i<files.length;i++){

      foto.push(
        await resizeImage(files[i])
      );

    }

    const data={

      tanggal:tanggal,

      area:"TRIYANTO",

      tokoPic:"KUTN",

      kodeToko:kode,

      namaToko:nama,

      status:"✅",

      foto:foto

    };

    const response =
      await fetch(
        API_URL,
        {
          method:"POST",
          headers:{
            "Content-Type":
              "text/plain;charset=utf-8"
          },
          body:JSON.stringify(data)
        }
      );

    const result =
      await response.json();

    if(!result.success){

      throw new Error(
        result.message ||
        "Gagal menyimpan"
      );

    }

    status.textContent="✅";

    button.textContent =
      "✅ SUDAH TERSIMPAN";

    button.style.background =
      "#16a34a";

    savedCount++;

    updateProgress();

    showMessage(
      `${kode}/${nama} berhasil disimpan online`,
      "success"
    );

  }catch(error){

    console.error(error);

    status.textContent="❌";

    button.disabled=false;

    button.textContent =
      "💾 COBA SIMPAN LAGI";

    showMessage(
      `${kode}/${nama}: ${error.message}`,
      "error"
    );

  }

}


function updateProgress(){

  document.getElementById(
    "progressText"
  ).textContent =
    `${savedCount} / 20 toko tersimpan`;

  document.getElementById(
    "progressBar"
  ).style.width =
    (savedCount/20*100)+"%";

}


function shareWhatsApp(kode,nama){

  const tanggal =
    document.getElementById(
      "tanggal"
    ).value;

  const text =
`*REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO*
*AREA : TRIYANTO*
*PER TGL : ${tanggal}*
*TOKO PIC : KUTN*

${kode}/${nama}/✅

Foto: 3–6 foto telah disiapkan melalui aplikasi.`;

  const url =
    "https://wa.me/?text=" +
    encodeURIComponent(text);

  window.open(url,"_blank");

}


renderStores();

</script>

</body>
 </html>
