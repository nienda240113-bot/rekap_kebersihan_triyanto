<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview WhatsApp - Rekap 20 Toko</title>
<style>
:root {
  --primary: #1677ff;
  --primary-hover: #0958d9;
  --whatsapp: #25d366;
  --whatsapp-hover: #1ebe5d;
  --bg-color: #f5f7fa;
  --card-bg: #ffffff;
  --text-main: #333333;
  --border-color: #d9d9d9;
}
body {
  font-family: Arial, sans-serif;
  background: var(--bg-color);
  margin: 0;
  padding: 10px;
  color: var(--text-main);
}
.box {
  max-width: 550px;
  margin: auto;
  background: var(--card-bg);
  padding: 16px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
}
h2 {
  font-size: 18px;
  margin-top: 0;
  margin-bottom: 4px;
}
.subtitle {
  font-size: 12px;
  color: #666;
  margin-bottom: 12px;
}

/* Statistik Cards */
.stats-container {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
  margin-bottom: 15px;
  text-align: center;
}
.stat-card {
  background: #fff;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 8px 2px;
}
.stat-num {
  font-size: 14px;
  font-weight: bold;
}
.stat-label {
  font-size: 9px;
  color: #666;
  margin-top: 2px;
}

/* Form Upload Utama */
.form-section {
  background: #fafafa;
  border: 1px solid var(--border-color);
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
}
label {
  display: block;
  font-weight: bold;
  margin-top: 8px;
  margin-bottom: 4px;
  font-size: 13px;
}
select, input[type="file"] {
  width: 100%;
  padding: 10px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
}

/* Grid 20 Toko Kartu */
.grid-box {
  background: #f0f2f5;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  padding: 10px;
  max-height: 380px;
  overflow-y: auto;
  margin-bottom: 15px;
}
.grid-20 {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.toko-card {
  background: #fff;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  overflow: hidden;
  text-align: center;
  font-size: 10px;
}
.toko-card-img {
  width: 100%;
  height: 45px;
  background: #e1e4e8;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #888;
  font-size: 8px;
  object-fit: cover;
}
.toko-card-body {
  padding: 4px;
}
.toko-card-title {
  font-weight: bold;
  font-size: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.toko-card-status {
  font-size: 8px;
  color: #666;
  margin-top: 2px;
}
.status-sudah { color: #52c41a; font-weight: bold; }

/* Tombol Aksi */
.action-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.btn {
  flex: 1;
  min-width: 45%;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  box-sizing: border-box;
  color: white;
}
.btn-primary { background: var(--primary); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-wa { background: var(--whatsapp); }
.btn-wa:hover { background: var(--whatsapp-hover); }
.btn-dark { background: #333; }
.btn:disabled { background: #ccc; cursor: not-allowed; }

#status-pesan {
  margin-top: 10px;
  padding: 10px;
  border-radius: 6px;
  font-size: 13px;
  text-align: center;
  display: none;
}
.alert-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block; }
.alert-error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block; }
.alert-info { background: #e6f4ff; color: #0958d9; border: 1px solid #91caff; display: block; }
</style>
</head>
<body>

<div class="box">
  <h2>📱 Preview WhatsApp</h2>
  <div class="subtitle">Grid selalu berisi 20 toko. Toko yang belum mengirim foto tetap ditampilkan.</div>

  <!-- Statistik Header -->
  <div class="stats-container">
    <div class="stat-card">
      <div id="stat-total" class="stat-num">20</div>
      <div class="stat-label">Total Toko</div>
    </div>
    <div class="stat-card">
      <div id="stat-sudah" class="stat-num" style="color:#52c41a;">0</div>
      <div class="stat-label">Sudah Kirim</div>
    </div>
    <div class="stat-card">
      <div id="stat-belum" class="stat-num" style="color:#faad14;">20</div>
      <div class="stat-label">Belum Kirim</div>
    </div>
    <div class="stat-card">
      <div id="stat-lengkap" class="stat-num">0</div>
      <div class="stat-label">Lengkap</div>
    </div>
    <div class="stat-card">
      <div id="stat-foto" class="stat-num">0</div>
      <div class="stat-label">Total Foto</div>
    </div>
  </div>

  <!-- Form Input & Upload -->
  <div class="form-section">
    <label for="toko">Pilih Toko Tujuan</label>
    <select id="toko" onchange="simpanPilihanToko()">
      <option value="">-- Pilih Toko --</option>
      <option value="C624|RWBT">C624 / RWBT</option>
      <option value="C560|RAJ">C560 / RAJ</option>
      <option value="CH81|CDKS">CH81 / CDKS</option>
      <option value="CG76|SPMM">CG76 / SPMM</option>
      <option value="C573|GMM">C573 / GMM</option>
      <option value="CE47|MKRI">CE47 / MKRI</option>
      <option value="CI30|STTD">CI30 / STTD</option>
      <option value="CH41|KPMRK">CH41 / KPMRK</option>
      <option value="CG54|MM2100">CG54 / MM2100</option>
      <option value="C935|TLJ2">C935 / TLJ2</option>
      <option value="CA71|WSGN">CA71 / WSGN</option>
      <option value="C965|CBNU">C965 / CBNU</option>
      <option value="CG86|JKST">CG86 / JKST</option>
      <option value="CA94|KPTI">CA94 / KPTI</option>
      <option value="C574|SKU">C574 / SKU</option>
      <option value="CI15|RPSU">CI15 / RPSU</option>
      <option value="CI54|RJLB">CI54 / RJLB</option>
      <option value="CF50|DNIA">CF50 / DNIA</option>
      <option value="CC21|KUTN">CC21 / KUTN</option>
      <option value="CI84|TLKW">CI84 / TLKW</option>
    </select>

    <label for="foto">Pilih File Foto (Multiple)</label>
    <input type="file" id="foto" accept="image/*" multiple>
  </div>

  <div id="status-pesan"></div>

  <!-- Grid 20 Toko Visual -->
  <div class="grid-box">
    <div id="grid-20-container" class="grid-20">
      <!-- Diisi otomatis oleh JavaScript -->
    </div>
  </div>

  <!-- Tombol Aksi Bawah -->
  <div class="action-buttons">
    <button class="btn btn-primary" onclick="refreshDashboard()">🔄 Refresh Grid</button>
    <a id="btn-wa-grid" href="#" target="_blank" class="btn btn-wa">📲 Kirim Grid ke WA</a>
    <button class="btn btn-dark" onclick="salinRekapTeks()">📋 Kirim Rekap Teks</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbwmae6m05HhR8Wm5NMFyh2Ocq1T15s6LPd1ky5jIH44UQA7cGnkAYggXunmPt7QM6uP/exec";

const listTokoData = [
  {id: 1, kode: "C624", nama: "RWBT"}, {id: 2, kode: "C560", nama: "RAJ"},
  {id: 3, kode: "CH81", nama: "CDKS"}, {id: 4, kode: "CG76", nama: "SPMM"},
  {id: 5, kode: "C573", nama: "GMM"}, {id: 6, kode: "CE47", nama: "MKRI"},
  {id: 7, kode: "CI30", nama: "STTD"}, {id: 8, kode: "CH41", nama: "KPMRK"},
  {id: 9, kode: "CG54", nama: "MM2100"}, {id: 10, kode: "C935", nama: "TLJ2"},
  {id: 11, kode: "CA71", nama: "WSGN"}, {id: 12, kode: "C965", nama: "CBNU"},
  {id: 13, kode: "CG86", nama: "JKST"}, {id: 14, kode: "CA94", nama: "KPTI"},
  {id: 15, kode: "C574", nama: "SKU"}, {id: 16, kode: "CI15", nama: "RPSU"},
  {id: 17, kode: "CI54", nama: "RJLB"}, {id: 18, kode: "CF50", nama: "DNIA"},
  {id: 19, kode: "CC21", nama: "KUTN"}, {id: 20, kode: "CI84", nama: "TLKW"}
];

window.addEventListener("DOMContentLoaded", () => {
  const savedToko = localStorage.getItem("last_selected_toko");
  if (savedToko) document.getElementById("toko").value = savedToko;
  renderGrid20Toko();
});

function simpanPilihanToko() {
  const val = document.getElementById("toko").value;
  if (val) localStorage.setItem("last_selected_toko", val);
}

// Render 20 Kartu Toko & Statistik di Atas
function renderGrid20Toko() {
  const container = document.getElementById("grid-20-container");
  container.innerHTML = "";

  let jumlahSudah = 0;
  let totalFotoSemua = 0;
  let teksRekapWA = `*REKAP LAPORAN FOTO 20 TOKO*\n📅 Tanggal: ${new Date().toLocaleDateString("id-ID")}\n\n`;

  listTokoData.forEach(toko => {
    const dataUpload = JSON.parse(localStorage.getItem(`upload_${toko.kode}`)) || { status: "Belum", jumlah: 0, thumbnail: "", links: [] };

    const card = document.createElement("div");
    card.className = "toko-card";

    let imgContent = `BELUM ADA FOTO`;
    let statusLabel = `BELUM KIRIM • 0 FOTO`;
    let statusClass = "";

    if (dataUpload.status === "Sukses") {
      jumlahSudah++;
      totalFotoSemua += dataUpload.jumlah;
      statusLabel = `<span class="status-sudah">SUDAH • ${dataUpload.jumlah} FOTO</span>`;
      
      if (dataUpload.thumbnail) {
        imgContent = `<img src="${dataUpload.thumbnail}" class="toko-card-img" alt="Foto">`;
      } else {
        imgContent = `<div class="toko-card-img" style="background:#52c41a; color:#fff;">TERKIRIM</div>`;
      }

      teksRekapWA += `📍 *${toko.id}. ${toko.kode}/${toko.nama}* (${dataUpload.jumlah} Foto):\n`;
      dataUpload.links.forEach(l => { teksRekapWA += ` - ${l}\n`; });
      teksRekapWA += `\n`;
    } else {
      teksRekapWA += `📍 *${toko.id}. ${toko.kode}/${toko.nama}*: Belum Kirim ❌\n\n`;
      imgContent = `<div class="toko-card-img">BELUM ADA FOTO</div>`;
    }

    card.innerHTML = `
      ${imgContent}
      <div class="toko-card-body">
        <div class="toko-card-title">${toko.id}. ${toko.kode}/${toko.nama}</div>
        <div class="toko-card-status">${statusLabel}</div>
      </div>
    `;
    container.appendChild(card);
  });

  // Update Angka Statistik Header
  document.getElementById("stat-sudah").textContent = jumlahSudah;
  document.getElementById("stat-belum").textContent = 20 - jumlahSudah;
  document.getElementById("stat-lengkap").textContent = jumlahSudah;
  document.getElementById("stat-foto").textContent = totalFotoSemua;

  // Set link tombol WhatsApp
  teksRekapWA += `📊 Progress: ${jumlahSudah} dari 20 Toko Selesai.`;
  document.getElementById("btn-wa-grid").href = `https://wa.me/?text=${encodeURIComponent(teksRekapWA)}`;
}

function refreshDashboard() {
  renderGrid20Toko();
  tampilStatus("🔄 Grid berhasil di-refresh!", "info");
}

function salinRekapTeks() {
  const tanggalHariIni = new Date().toLocaleDateString("id-ID");
  let teks = `*REKAP LAPORAN FOTO 20 TOKO*\n📅 Tanggal: ${tanggalHariIni}\n\n`;
  
  listTokoData.forEach(toko => {
    const dataUpload = JSON.parse(localStorage.getItem(`upload_${toko.kode}`)) || { status: "Belum", jumlah: 0 };
    if (dataUpload.status === "Sukses") {
      teks += `✅ ${toko.id}. ${toko.kode}/${toko.nama} (${dataUpload.jumlah} Foto)\n`;
    } else {
      teks += `❌ ${toko.id}. ${toko.kode}/${toko.nama} (Belum)\n`;
    }
  });

  navigator.clipboard.writeText(teks);
  alert("📋 Ringkasan rekap teks berhasil disalin ke clipboard!");
}

// Proses Upload Foto Saat Tombol Dipilih / Otomatis
document.getElementById("foto").addEventListener("change", async function() {
  const tokoVal = document.getElementById("toko").value;
  const files = this.files;

  if (!tokoVal) {
    tampilStatus("⚠️ Pilih toko tujuan di atas terlebih dahulu!", "error");
    this.value = "";
    return;
  }

  if (files.length === 0) return;

  const [kodeToko, namaToko] = tokoVal.split("|");
  tampilStatus(`⏳ Mengompres & Mengupload ${files.length} foto untuk ${kodeToko}...`, "info");

  let sukses = 0;
  let listLinkDrive = [];
  let thumbnailPertama = "";

  for (let i = 0; i < files.length; i++) {
    try {
      const base64Compressed = await kompresDanUbahKeBase64(files[i], 800, 0.5);
      if (i === 0) thumbnailPertama = `data:image/jpeg;base64,${base64Compressed}`;

      const payload = {
        kodeToko: kodeToko,
        namaToko: namaToko,
        namaFile: `${kodeToko}_${Date.now()}_${files[i].name}`,
        mimeType: "image/jpeg",
        foto: base64Compressed
      };

      const response = await fetch(API, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const hasil = await response.json();
      if (hasil.status === "success") {
        sukses++;
        if (hasil.link) listLinkDrive.push(hasil.link);
      }
    } catch (err) {
      console.error(err);
    }
  }

  if (sukses > 0) {
    // Simpan ke memori lokal browser
    localStorage.setItem(`upload_${kodeToko}`, JSON.stringify({
      status: "Sukses",
      jumlah: sukses,
      thumbnail: thumbnailPertama,
      links: listLinkDrive
    }));

    tampilStatus(`✅ Berhasil mengupload ${sukses} foto untuk toko ${kodeToko}!`, "success");
    renderGrid20Toko();
    this.value = ""; // Reset input file
  } else {
    tampilStatus("⚠️ Gagal mengupload foto. Periksa koneksi atau Google Apps Script.", "error");
  }
});

function kompresDanUbahKeBase64(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

function tampilStatus(pesan, jenis) {
  const status = document.getElementById("status-pesan");
  status.className = `alert-${jenis}`;
  status.innerHTML = pesan;
  status.style.display = "block";
}
</script>

</body>
</html>
