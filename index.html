<style>

}
body {

  background: var(--bg-color);
  margin: 0;
  padding: 8px;
  color: var(--text-main);
  -webkit-tap-highlight-color: transparent;
}
.box {
  max-width: 650px;

h3.title {

}
.sub-desc {

  color: #666;
  margin-bottom: 10px;

}

/* Kotak Statistik */
.stats-container {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  margin-bottom: 12px;

}
.stat-box {

  border-radius: 6px;

}

}

}

.toko-card {

/* Form Input Standar */
label { display: block; font-weight: bold; margin-top: 8px; margin-bottom: 3px; font-size: 11.5px; }
select {
  width: 100%;
  padding: 9px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 12.5px;
  background: #fafafa;

/* Tombol Pilihan Kamera & Galeri */
.upload-buttons-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-top: 5px;
}
.file-upload-wrapper {

  overflow: hidden;
  width: 100%;

.file-upload-wrapper input[type=file] {
  font-size: 100px;
  position: absolute;
  left: 0;
  top: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.btn-custom-option {
  display: flex;
  align-items: center;
  justify-content: center;

  width: 100%;
  padding: 11px 6px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: bold;
  color: white;
  text-align: center;
  box-sizing: border-box;
  cursor: pointer;
}
.btn-gallery { background: var(--primary); }
.btn-camera { background: var(--camera-btn); }

#preview-upload {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
  margin-top: 8px;
}
#preview-upload img {
  width: 100%;
  height: 75px;
  object-fit: cover;
  border-radius: 6px;
}

/* Tombol Aksi */
.action-buttons {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
  margin-top: 12px;
}
.btn {
  padding: 11px;
  border: 0;
  border-radius: 8px;
  font-size: 11.5px;
  font-weight: bold;
  cursor: pointer;
  text-align: center;
  text-decoration: none;

  align-items: center;

}
.btn-primary { background: var(--primary); }
.btn-wa { background: var(--whatsapp); font-size: 13.5px; padding: 13px; }

.btn-danger { background: var(--danger); font-size: 11.5px; padding: 11px; margin-top: 15px; width: 100%; }
.btn-danger:hover { background: var(--danger-hover); }
.btn:disabled { background: #d9d9d9 !important; cursor: not-allowed; color: #888; }

/* Tombol Bantuan & Instal */
.header-btns {
  position: absolute;
  top: 10px;
  right: 10px;
  display: flex;
  gap: 5px;
}
.btn-top {
  border: none;
  border-radius: 50%;
  width: 26px;

  align-items: center;

/* Tooltip & Tour */
#tour-overlay {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 998;

  align-items: center;
  justify-content: center;
  padding: 15px;
  box-sizing: border-box;
}
.tour-card {
  background: white;
  padding: 18px;
  border-radius: 12px;
  max-width: 300px;
  width: 100%;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);

}
@keyframes popIn {

}
.tour-title { font-weight: bold; font-size: 14px; color: #1677ff; margin-bottom: 6px; }
.tour-text { font-size: 12px; color: #444; margin-bottom: 12px; line-height: 1.4; }
.tour-buttons { display: flex; gap: 6px; justify-content: center; }
.tour-btn { padding: 7px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 11.5px; }
.tour-btn-next { background: #1677ff; color: white; }

#status {

<script>
const API = "https://script.google.com/macros/s/AKfycbxh5t0XFoNVOR6_ItgpM_d-0tcn_dMHFRdRza2yc4-0RIG9IUnMc_Ziivn1XFwdeY-T/exec";

const listTokoData = [
  {id: 1, kode: "C624", nama: "RWBT"}, {id: 2, kode: "C560", nama: "RAJ"},
  {id: 3, kode: "CH81", nama: "CDKS"}, {id: 4, kode: "CG76", nama: "SPMM"},
  {id: 5, kode: "C573", nama: "GMM"}, {id: 6, kode: "CE47", nama: "MKRI"},
  {id: 7, kode: "CI30", nama: "STTD"}, {id: 8, kode: "CH41", nama: "KPMRK"},
  {id: 9, kode: "CG54", nama: "MM2100"}, {id: 10, kode: "C935", nama: "TLJ2"},
  {id: 11, kode: "CA71", nama: "WSGN"}, {id: 12, kode: "C965", nama: "CBNU"},
  {id: 13, kode: "CG86", nama: "JKST"}, {id: 14, kode: "CA94", nama: "KPTI"},
  {id: 15, kode: "C574", nama: "SKU"}, {id: 16, kode: "CI15", nama: "RPSU"},
  {id: 17, kode: "CI54", nama: "RJLB"}, {id: 18, kode: "CF50", nama: "DNIA"},
  {id: 19, kode: "CC21", nama: "KUTN"}, {id: 20, kode: "CI84", nama: "TLKW"}
];

let globalSelectedFiles = [];
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById("btn-install-app").style.display = "flex";
});

function installAplikasi() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === 'accepted') {
        console.log('User menginstal aplikasi');
      }
      deferredPrompt = null;
      document.getElementById("btn-install-app").style.display = "none";
    });
  } else {
    alert("Untuk menginstal di iPhone/iPad, ketuk tombol 'Bagikan' di Safari lalu pilih 'Tambahkan ke Layar Utama'.");
  }
}

window.addEventListener("DOMContentLoaded", () => {
  const savedToko = localStorage.getItem("last_selected_toko");
  if (savedToko) {
    document.getElementById("toko").value = savedToko;
    document.getElementById("foto-kamera").disabled = false;
    document.getElementById("foto-galeri").disabled = false;
  }
  sinkronisasiDataGlobal();
});

function sinkronisasiDataGlobal() {
  tampilStatus("⏳ Menyinkronkan data antar perangkat...", "info");
  const script = document.createElement("script");
  script.src = `${API}?callback=terimaDataCloud`;
  document.body.appendChild(script);
}

window.terimaDataCloud = function(result) {
  if (result && result.status === "success" && result.data) {
    listTokoData.forEach(toko => {
      localStorage.removeItem(`upload_${toko.kode}`);
    });

    result.data.forEach(item => {
      if (item.kodeToko && item.collageImg) {
        localStorage.setItem(`upload_${item.kodeToko}`, JSON.stringify({
          status: "Sukses",
          jumlah: parseInt(item.jumlah) || 1,
          collageImg: item.collageImg,
          links: []
        }));
      }
    });

    renderGridVisual();
    tampilStatus("✅ Sinkronisasi antar device berhasil!", "success");
    setTimeout(() => { document.getElementById("status").style.display = "none"; }, 1500);
  } else {
    renderGridVisual();
    document.getElementById("status").style.display = "none";
  }
};

function validasiPilihToko() {
  const val = document.getElementById("toko").value;
  const inputKamera = document.getElementById("foto-kamera");
  const inputGaleri = document.getElementById("foto-galeri");
  
  if (!val) {
    inputKamera.disabled = true;
    inputGaleri.disabled = true;
    tampilStatus("⚠️ Silakan pilih Nama Toko terlebih dahulu!", "error");
  } else {
    inputKamera.disabled = false;
    inputGaleri.disabled = false;
    localStorage.setItem("last_selected_toko", val);
    tampilStatus("✅ Toko terpilih. Silakan gunakan Kamera atau Galeri.", "success");
    setTimeout(() => { document.getElementById("status").style.display = "none"; }, 2000);
  }
}

function prosesPilihFoto(inputElement) {
  const tokoVal = document.getElementById("toko").value;
  const btnUpload = document.getElementById("btn-upload");
  const preview = document.getElementById("preview-upload");
  const fileInfo = document.getElementById("file-info");
  preview.innerHTML = "";

  if (!tokoVal) {
    tampilStatus("❌ ERROR: Pilih Toko terlebih dahulu!", "error");
    inputElement.value = "";
    return;
  }

  const files = inputElement.files;
  if (files.length < 1) {
    btnUpload.disabled = true;
    fileInfo.textContent = "";
    return;
  }
  if (files.length > 6) {
    btnUpload.disabled = true;
    fileInfo.textContent = "";
    tampilStatus("❌ Maksimal hanya boleh 6 foto!", "error");
    inputElement.value = "";
    return;
  }

  globalSelectedFiles = files;
  btnUpload.disabled = false;
  fileInfo.textContent = `✅ ${files.length} Foto terpilih dan siap di-upload.`;
  tampilStatus("✅ Foto siap di-upload.", "success");
  setTimeout(() => { document.getElementById("status").style.display = "none"; }, 2000);

  for (const file of files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.createElement("img");
      img.src = e.target.result;
      preview.appendChild(img);
    }
    reader.readAsDataURL(file);
  }
}

async function resetSemuaGridRealtime() {
  if (confirm("⚠️ Yakin ingin menghapus seluruh data laporan hari ini secara permanen dari server?")) {
    tampilStatus("🗑️ Menghapus data dari server...", "info");
    
    listTokoData.forEach(toko => {
      localStorage.removeItem(`upload_${toko.kode}`);
    });

    try {
      await fetch(API, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ action: "reset" })
      });
    } catch(err) {
      console.error(err);
    }

    renderGridVisual();
    tampilStatus("✅ Semua data berhasil dikosongkan.", "success");
    setTimeout(() => { document.getElementById("status").style.display = "none"; }, 2000);
  }
}

let currentStep = 0;
const tourSteps = [
  { element: "step-1-container", title: "Langkah 1: Pilih Toko 📍", text: "Wajib pilih toko sebelum mengambil foto." },
  { element: "step-2-container", title: "Langkah 2: Ambil Foto 📷", text: "Pilih langsung dari Kamera atau Galeri HP." },
  { element: "step-3-container", title: "Langkah 3: Upload Kilat ⚡", text: "Mengirim data secara real-time ke Cloud pusat." },
  { element: "step-4-container", title: "Langkah 4: Kirim WhatsApp 💬", text: "Bagikan rekap grid gambar HD ke grup WhatsApp." }
];

function mulaiPanduan() {
  currentStep = 0;
  document.getElementById("tour-overlay").style.display = "flex";
  tampilLangkahTour();
}

function tampilLangkahTour() {
  tourSteps.forEach(step => {
    const el = document.getElementById(step.element);
    if (el) el.classList.remove("highlight-target");
  });

  if (currentStep >= tourSteps.length) {
    tutupPanduan();
    return;
  }

  const step = tourSteps[currentStep];
  const targetEl = document.getElementById(step.element);
  if (targetEl) {
    targetEl.classList.add("highlight-target");
    targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  document.getElementById("tour-title").textContent = step.title;
  document.getElementById("tour-text").textContent = step.text;
  
  const nextBtn = document.getElementById("tour-next-btn");
  nextBtn.textContent = (currentStep === tourSteps.length - 1) ? "Selesai ✓" : "Lanjut ➔";
}

function lanjutPanduan() {
  currentStep++;
  tampilLangkahTour();
}

function tutupPanduan() {
  tourSteps.forEach(step => {
    const el = document.getElementById(step.element);
    if (el) el.classList.remove("highlight-target");
  });
  document.getElementById("tour-overlay").style.display = "none";
}

async function buatKolaseThumbnail(base64List) {
  return new Promise((resolve) => {
    if (!base64List || base64List.length === 0) { resolve(""); return; }
    const canvas = document.createElement("canvas");
    canvas.width = 300; 
    canvas.height = 300;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 300, 300);

    let loadedCount = 0;
    const imgObjects = [];

    base64List.forEach((b64, idx) => {
      const img = new Image();
      img.src = b64;
      img.onload = () => {
        imgObjects[idx] = img;
        loadedCount++;
        if (loadedCount === base64List.length) {
          gambarKeCanvasKecil(ctx, imgObjects);
          resolve(canvas.toDataURL("image/jpeg", 0.6));
        }
      };
      img.onerror = () => {
        loadedCount++;
        if (loadedCount === base64List.length) resolve("");
      };
    });
  });
}

function gambarKeCanvasKecil(ctx, imgs) {
  const validImgs = imgs.filter(Boolean);
  const len = validImgs.length;
  if (len === 1) {
    ctx.drawImage(validImgs[0], 0, 0, 300, 300);
  } else if (len === 2) {
    ctx.drawImage(validImgs[0], 0, 0, 150, 300);
    ctx.drawImage(validImgs[1], 150, 0, 150, 300);
  } else if (len <= 4) {
    let w = 150, h = 150;
    validImgs.forEach((img, i) => {
      let x = (i % 2) * w;
      let y = Math.floor(i / 2) * h;
      ctx.drawImage(img, x, y, w, h);
    });
  } else {
    let w = 100, h = 100;
    validImgs.forEach((img, i) => {
      if (i < 9) {
        let x = (i % 3) * w;
        let y = Math.floor(i / 3) * h;
        ctx.drawImage(img, x, y, w, h);
      }
    });
  }
}

async function buatMasterGridImageUltraHD() {
  return new Promise((resolve) => {
    const canvas = document.createElement("canvas");
    const cols = 5; const rows = 4;
    const itemWidth = 800; 
    const itemHeight = 920;
    
    canvas.width = cols * itemWidth;
    canvas.height = rows * itemHeight;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let loaded = 0;
    listTokoData.forEach((toko, index) => {
      const dataUpload = JSON.parse(localStorage.getItem(`upload_${toko.kode}`)) || { collageImg: "" };
      const x = (index % cols) * itemWidth;
      const y = Math.floor(index / cols) * itemHeight;

      if (dataUpload.collageImg) {
        const img = new Image();
        img.src = dataUpload.collageImg;
        img.onload = () => {
          ctx.drawImage(img, x + 20, y + 20, itemWidth - 40, itemWidth - 40);
          
          ctx.fillStyle = "#f9f9f9";
          ctx.fillRect(x + 20, y + itemWidth, itemWidth - 40, 95);
          ctx.strokeStyle = "#bbb";
          ctx.lineWidth = 4;
          ctx.strokeRect(x + 20, y + 20, itemWidth - 40, itemWidth + 90);

          ctx.fillStyle = "#000";
          ctx.font = "bold 42px Arial";
          ctx.textAlign = "center";
          ctx.fillText(`${toko.id}. ${toko.kode}/${toko.nama}`, x + (itemWidth / 2), y + itemWidth + 62);

          loaded++;
          if (loaded === 20) resolve(canvas.toDataURL("image/jpeg", 0.9));
        };
        img.onerror = () => {
          gambarKotakKosongUltra(ctx, toko, x, y, itemWidth);
          loaded++;
          if (loaded === 20) resolve(canvas.toDataURL("image/jpeg", 0.9));
        };
      } else {
        gambarKotakKosongUltra(ctx, toko, x, y, itemWidth);
        loaded++;
        if (loaded === 20) resolve(canvas.toDataURL("image/jpeg", 0.9));
      }
    });
  });
}

function gambarKotakKosongUltra(ctx, toko, x, y, itemWidth) {
  ctx.fillStyle = "#f2f2f2";
  ctx.fillRect(x + 20, y + 20, itemWidth - 40, itemWidth - 40);
  ctx.strokeStyle = "#bbb";
  ctx.lineWidth = 4;
  ctx.strokeRect(x + 20, y + 20, itemWidth - 40, itemWidth + 90);

  ctx.fillStyle = "#777";
  ctx.font = "36px Arial";
  ctx.textAlign = "center";
  ctx.fillText("Belum Ada Foto", x + (itemWidth / 2), y + (itemWidth / 2));

  ctx.fillStyle = "#000";
  ctx.font = "bold 42px Arial";
  ctx.fillText(`${toko.id}. ${toko.kode}/${toko.nama}`, x + (itemWidth / 2), y + itemWidth + 62);
}

async function shareMasterGridDirectly() {
  const btnWa = document.getElementById("btn-wa");
  if (btnWa.disabled) {
    tampilStatus("❌ Selesaikan minimal 1 upload toko terlebih dahulu.", "error");
    return;
  }

  tampilStatus("⏳ Merakit Master Grid Ultra HD...", "info");
  const dataUrl = await buatMasterGridImageUltraHD();

  const blob = await (await fetch(dataUrl)).blob();
  const file = new File([blob], `APLIKASI_DAILY_ACTIVITY_${Date.now()}.jpg`, { type: "image/jpeg" });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({
        title: 'APLIKASI DAILY ACTIVITY AREA TRIYANTO 2O26',
        text: window.teksLaporanFinal || 'Berikut rekap laporan harian.',
        files: [file]
      });
      tampilStatus("✅ Berhasil membagikan grid ke WhatsApp!", "success");
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.error(err);
        downloadMasterGridFallback(dataUrl);
      }
    }
  } else {
    downloadMasterGridFallback(dataUrl);
  }
}

function downloadMasterGridFallback(dataUrl) {
  const a = document.createElement("a");
  a.href = dataUrl;
  a.download = `APLIKASI_DAILY_ACTIVITY_${Date.now()}.jpg`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  tampilStatus("⚠️ Gambar terunduh. Silakan kirim ke WA beserta teks rekap.", "success");
}

async function kirimFoto() {
  const tokoVal = document.getElementById("toko").value;
  const files = globalSelectedFiles;
  const tombol = document.getElementById("btn-upload");

  if (!tokoVal) { 
    tampilStatus("❌ Pilih Toko terlebih dahulu.", "error"); 
    return; 
  }
  if (!files || files.length < 1 || files.length > 6) { 
    tampilStatus("❌ Pilih minimal 1 dan maksimal 6 foto.", "error"); 
    return; 
  }

  const [kodeToko, namaToko] = tokoVal.split("|");
  tombol.disabled = true;
  tampilStatus(`⚡ Memproses & Mengirim ke Cloud Pusat...`, "info");

  let base64Collection = [];
  for (const file of files) {
    const base64Compressed = await kompresDanUbahKeBase64(file, 480, 0.5);
    base64Collection.push(`data:image/jpeg;base64,${base64Compressed}`);
  }

  const finalCollage = await buatKolaseThumbnail(base64Collection);

  const payload = {
    kodeToko: kodeToko,
    namaToko: namaToko,
    jumlahFoto: files.length,
    collageImg: finalCollage,
    listLink: ""
  };

  localStorage.setItem(`upload_${kodeToko}`, JSON.stringify({
    status: "Sukses",
    jumlah: files.length,
    collageImg: finalCollage,
    links: []
  }));

  try {
    await fetch(API, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
  } catch(err) {
    console.log("Network warning:", err);
  }

  tombol.disabled = false;
  tampilStatus(`✅ Sukses! Data tersimpan di Cloud pusat.`, "success");
  
  renderGridVisual();

  document.getElementById("foto-kamera").value = "";
  document.getElementById("foto-galeri").value = "";
  document.getElementById("file-info").textContent = "";
  document.getElementById("preview-upload").innerHTML = "";
  document.getElementById("btn-upload").disabled = true;
  globalSelectedFiles = [];
  setTimeout(() => { document.getElementById("status").style.display = "none"; }, 2000);
}

function kompresDanUbahKeBase64(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality).split(",")[1]);
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}

function tampilStatus(pesan, jenis) {
  const status = document.getElementById("status");
  status.className = `status-${jenis}`;
  status.style.display = "block";
  status.innerHTML = pesan;
}
