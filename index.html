<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Foto Toko - Upgrade</title>

<style>
:root {
  --primary: #1677ff;
  --primary-hover: #0958d9;
  --bg-color: #f5f7fa;
  --card-bg: #ffffff;
  --text-main: #333333;
  --border-color: #d9d9d9;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-color);
  margin: 0;
  padding: 15px;
  color: var(--text-main);
}

.box {
  max-width: 500px;
  margin: 20px auto;
  background: var(--card-bg);
  padding: 24px;
  border-radius: 16px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
}

h2 {
  text-align: center;
  margin-top: 0;
  color: #1f1f1f;
  font-size: 22px;
}

label {
  display: block;
  font-weight: 600;
  margin-top: 18px;
  margin-bottom: 8px;
  font-size: 14px;
}

select, input[type="file"] {
  width: 100%;
  padding: 12px 14px;
  box-sizing: border-box;
  border: 1px solid var(--border-color);
  border-radius: 10px;
  font-size: 15px;
  background: #fafafa;
  transition: all 0.3s;
}

select:focus, input[type="file"]:focus {
  border-color: var(--primary);
  outline: none;
  background: #fff;
  box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.1);
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 24px;
  border: 0;
  border-radius: 10px;
  background: var(--primary);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.3s, transform 0.1s;
}

button:hover:not(:disabled) {
  background: var(--primary-hover);
}

button:active:not(:disabled) {
  transform: scale(0.98);
}

button:disabled {
  background: #bfbfbf;
  cursor: not-allowed;
}

#preview {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.preview-item {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  background: #000;
}

#preview img {
  width: 100%;
  height: 130px;
  object-fit: cover;
  display: block;
}

.file-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 10px;
  padding: 3px 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#status {
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
  font-size: 14px;
  font-weight: 500;
  display: none;
}

.status-info { background: #e6f4ff; color: #0958d9; border: 1px solid #91caff; display: block !important; }
.status-success { background: #f6ffed; color: #52c41a; border: 1px solid #b7eb8f; display: block !important; }
.status-error { background: #fff2f0; color: #ff4d4f; border: 1px solid #ffccc7; display: block !important; }
</style>
</head>

<body>

<div class="box">
  <h2>📸 LAPORAN FOTO TOKO</h2>

  <label for="toko">Pilih Toko</label>
  <select id="toko" onchange="simpanPilihanToko()">
    <option value="">-- Pilih Toko --</option>
    <option value="C624|RWBT">C624 / RWBT</option>
    <option value="C560|RAJ">C560 / RAJ</option>
    <option value="CH81|CDKS">CH81 / CDKS</option>
    <option value="CG76|SPMM">CG76 / SPMM</option>
    <option value="C573|GMM">C573 / GMM</option>
    <option value="CE47|MKRI">CE47 / MKRI</option>
    <option value="CI30|STTD">CI30 / STTD</option>
    <option value="CH41|KPMRK">CH41 / KPMRK</option>
    <option value="CG54|MM2100">CG54 / MM2100</option>
    <option value="C935|TLJ2">C935 / TLJ2</option>
    <option value="CA71|WSGN">CA71 / WSGN</option>
    <option value="C965|CBNU">C965 / CBNU</option>
    <option value="CG86|JKST">CG86 / JKST</option>
    <option value="CA94|KPTI">CA94 / KPTI</option>
    <option value="C574|SKU">C574 / SKU</option>
    <option value="CI15|RPSU">CI15 / RPSU</option>
    <option value="CI54|RJLB">CI54 / RJLB</option>
    <option value="CF50|DNIA">CF50 / DNIA</option>
    <option value="CC21|KUTN">CC21 / KUTN</option>
    <option value="CI84|TLKW">CI84 / TLKW</option>
  </select>

  <label for="foto">Pilih Foto</label>
  <input type="file" id="foto" accept="image/*" multiple>

  <div id="preview"></div>
  <div id="status"></div>

  <button id="upload" onclick="kirimFoto()">📤 UPLOAD FOTO</button>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbznlq75doudRBOjvBju0KCt7eSQ5f0mi_FHUd7780bvAKwl_RncH6QG38fA_dT8kR6y/exec";

// Memuat toko terakhir yang dipilih dari localStorage
window.addEventListener("DOMContentLoaded", () => {
  const savedToko = localStorage.getItem("last_selected_toko");
  if (savedToko) {
    document.getElementById("toko").value = savedToko;
  }
});

function simpanPilihanToko() {
  const val = document.getElementById("toko").value;
  if (val) {
    localStorage.setItem("last_selected_toko", val);
  }
}

/* PREVIEW GAMBAR */
document.getElementById("foto").addEventListener("change", function() {
  const preview = document.getElementById("preview");
  preview.innerHTML = "";

  for (const file of this.files) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const container = document.createElement("div");
      container.className = "preview-item";

      const img = document.createElement("img");
      img.src = e.target.result;

      const nameTag = document.createElement("div");
      nameTag.className = "file-name";
      nameTag.textContent = file.name;

      container.appendChild(img);
      container.appendChild(nameTag);
      preview.appendChild(container);
    }
    reader.readAsDataURL(file);
  }
});

/* UPLOAD DENGAN KOMPRESI & PROGRESS */
async function kirimFoto() {
  const tokoVal = document.getElementById("toko").value;
  const files = document.getElementById("foto").files;
  const tombol = document.getElementById("upload");
  const status = document.getElementById("status");

  if (!tokoVal) {
    tampilStatus("⚠️ Pilih toko terlebih dahulu", "error");
    return;
  }

  if (files.length === 0) {
    tampilStatus("⚠️ Pilih foto terlebih dahulu", "error");
    return;
  }

  const [kodeToko, namaToko] = tokoVal.split("|");

  tombol.disabled = true;
  let sukses = 0;
  let gagal = 0;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    tampilStatus(`⏳ Mengompres & Mengupload (${i + 1}/${files.length})...`, "info");

    try {
      // Kompres gambar agar ukuran file lebih kecil (maks lebar 1200px, kualitas 0.7)
      const base64Compressed = await kompresDanUbahKeBase64(file, 1200, 0.7);

      const payload = {
        kodeToko: kodeToko,
        namaToko: namaToko,
        namaFile: `${kodeToko}_${Date.now()}_${file.name}`,
        mimeType: "image/jpeg",
        foto: base64Compressed
      };

      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });

      const hasil = await response.json();

      if (hasil.status === "success") {
        sukses++;
      } else {
        gagal++;
      }
    } catch (error) {
      console.error(error);
      gagal++;
    }
  }

  tombol.disabled = false;

  if (gagal === 0) {
    tampilStatus(`✅ Berhasil upload ${sukses} foto toko ${kodeToko}`, "success");
    document.getElementById("foto").value = "";
    document.getElementById("preview").innerHTML = "";
  } else {
    tampilStatus(`⚠️ Berhasil: ${sukses} | Gagal: ${gagal}`, "error");
  }
}

/* FUNGSI KOMPRESI GAMBAR & BASE64 */
function kompresDanUbahKeBase64(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function(event) {
      const img = new Image();
      img.src = event.target.result;
      img.onload = function() {
        let width = img.width;
        let height = img.height;

        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);

        // Ekstrak ke format JPEG dengan kualitas yang diatur
        const dataUrl = canvas.toDataURL("image/jpeg", quality);
        const base64Data = dataUrl.split(",")[1];
        resolve(base64Data);
      };
      img.onerror = (err) => reject(err);
    };
    reader.onerror = (err) => reject(err);
  });
}

function tampilStatus(pesan, jenis) {
  const status = document.getElementById("status");
  status.className = `status-${jenis}`;
  status.innerHTML = pesan;
}
</script>

</body>
</html>
