<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Rekap Kebersihan Triyanto</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f1f5f9;
color:#111827;
}

header{
background:#0f766e;
color:white;
padding:18px 12px;
text-align:center;
}

header h1{
font-size:20px;
margin:0 0 7px;
}

header p{
margin:3px 0;
font-size:14px;
}

.container{
max-width:720px;
margin:auto;
padding:12px;
}

.card{
background:white;
border-radius:14px;
padding:15px;
margin-bottom:14px;
box-shadow:0 2px 8px #0001;
}

label{
font-weight:bold;
display:block;
margin-bottom:6px;
}

input[type=date]{
width:100%;
padding:12px;
border:1px solid #cbd5e1;
border-radius:9px;
font-size:15px;
}

.progress-text{
font-weight:bold;
margin-bottom:8px;
}

.progress{
height:13px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
}

.progress-bar{
height:100%;
width:0%;
background:#0f766e;
transition:.3s;
}

.store{
background:white;
border-radius:14px;
padding:15px;
margin-bottom:14px;
box-shadow:0 2px 8px #0001;
}

.store-header{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:12px;
}

.store-name{
font-size:17px;
font-weight:bold;
}

.status{
font-size:22px;
}

.photo-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
}

.photo-buttons button{
border:0;
border-radius:10px;
padding:13px 5px;
font-size:14px;
font-weight:bold;
color:white;
}

.camera{
background:#2563eb;
}

.gallery{
background:#7c3aed;
}

.photo-info{
font-size:13px;
font-weight:bold;
margin-top:10px;
}

.preview{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:7px;
margin-top:10px;
}

.preview-box{
position:relative;
}

.preview-box img{
width:100%;
height:100px;
object-fit:cover;
border-radius:8px;
}

.delete-photo{
position:absolute;
right:4px;
top:4px;
width:25px;
height:25px;
border:0;
border-radius:50%;
background:#dc2626;
color:white;
font-weight:bold;
font-size:17px;
padding:0;
}

.save{
width:100%;
border:0;
border-radius:10px;
padding:14px;
margin-top:12px;
background:#0f766e;
color:white;
font-weight:bold;
font-size:15px;
}

.save:disabled{
background:#94a3b8;
}

.whatsapp{
width:100%;
border:0;
border-radius:10px;
padding:14px;
margin-top:8px;
background:#16a34a;
color:white;
font-weight:bold;
font-size:15px;
}

.message{
position:fixed;
left:10px;
right:10px;
bottom:10px;
padding:14px;
border-radius:10px;
color:white;
font-weight:bold;
text-align:center;
display:none;
z-index:9999;
}

.message.success{
background:#16a34a;
}

.message.error{
background:#dc2626;
}

.message.loading{
background:#2563eb;
}

</style>
</head>


<body>


<header>

<h1>
REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO
</h1>

<p>AREA : TRIYANTO</p>

<p>TOKO PIC : KUTN</p>

</header>


<div class="container">


<!-- TANGGAL -->

<div class="card">

<label>Tanggal Laporan</label>

<input
id="tanggal"
type="date">

</div>


<!-- PROGRESS -->

<div class="card">

<div
class="progress-text"
id="progressText">

0 / 20 toko tersimpan

</div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

</div>


<!-- DAFTAR TOKO -->

<div id="daftarToko"></div>


</div>


<div
id="message"
class="message">
</div>


<script>


/* =====================================================
   URL DATABASE GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzLr5lu9lj-w9r0n9FTGLhtID30fnEAQhMwjhiKePpSrhfVP1OLKyFh3P5-y3BHmSSR/exec";


/* =====================================================
   20 TOKO AREA TRIYANTO
===================================================== */

const TOKO = [

["C624","RWBT"],
["C560","RAJ"],
["CH81","CDKS"],
["CG76","SPMM"],
["C573","GMM"],
["CE47","MKRI"],
["CI30","STTD"],
["CH41","KPMRK"],
["CG54","MM2100"],
["C935","TLJ2"],
["CA71","WSGN"],
["C965","CBNU"],
["CG86","JKST"],
["CA94","KPTI"],
["C574","SKU"],
["CI15","RPSU"],
["CI54","RJLB"],
["CF50","DNIA"],
["CC21","KUTN"],
["CI84","TLKW"]

];


/* =====================================================
   PENYIMPANAN FOTO
===================================================== */

const FOTO = {};

const SUDAH_SIMPAN = new Set();


/* =====================================================
   TANGGAL OTOMATIS
===================================================== */

const d = new Date();

document.getElementById("tanggal").value =
d.getFullYear() +
"-" +
String(d.getMonth()+1).padStart(2,"0") +
"-" +
String(d.getDate()).padStart(2,"0");


/* =====================================================
   PESAN
===================================================== */

function pesan(text,type){

const el =
document.getElementById("message");

el.textContent=text;

el.className =
"message " + type;

el.style.display="block";

if(type !== "loading"){

setTimeout(function(){

el.style.display="none";

},4000);

}

}


/* =====================================================
   MEMBUAT 20 TOKO
===================================================== */

function tampilkanToko(){

const area =
document.getElementById("daftarToko");

area.innerHTML="";


TOKO.forEach(function(toko,index){

const kode=toko[0];

const nama=toko[1];

FOTO[kode]=[];


const box =
document.createElement("div");

box.className="store";


box.innerHTML=`

<div class="store-header">

<div class="store-name">

${index+1}. ${kode} / ${nama}

</div>

<div
class="status"
id="status-${kode}">

⏳

</div>

</div>


<div class="photo-buttons">


<button
class="camera"
onclick="kamera('${kode}')">

📷 Ambil Foto

</button>


<button
class="gallery"
onclick="galeri('${kode}')">

🖼️ Pilih dari Galeri

</button>


</div>


<input
type="file"
id="camera-${kode}"
accept="image/*"
capture="environment"
hidden>


<input
type="file"
id="gallery-${kode}"
accept="image/*"
multiple
hidden>


<div
class="photo-info"
id="info-${kode}">

Belum ada foto — wajib 3 sampai 6 foto

</div>


<div
class="preview"
id="preview-${kode}">
</div>


<button
class="save"
id="save-${kode}"
onclick="simpan('${kode}','${nama}')">

💾 SIMPAN ONLINE

</button>


<button
class="whatsapp"
onclick="whatsapp('${kode}','${nama}')">

📲 KIRIM WHATSAPP

</button>

`;


area.appendChild(box);


/* KAMERA */

document
.getElementById(`camera-${kode}`)
.addEventListener(
"change",
function(){

tambahFoto(
kode,
this.files
);

this.value="";

}
);


/* GALERI */

document
.getElementById(`gallery-${kode}`)
.addEventListener(
"change",
function(){

tambahFoto(
kode,
this.files
);

this.value="";

}
);

});

}


/* =====================================================
   BUKA KAMERA
===================================================== */

function kamera(kode){

document
.getElementById(`camera-${kode}`)
.click();

}


/* =====================================================
   BUKA GALERI
===================================================== */

function galeri(kode){

document
.getElementById(`gallery-${kode}`)
.click();

}


/* =====================================================
   TAMBAH FOTO
===================================================== */

function tambahFoto(kode,files){

const daftar =
FOTO[kode];


for(
let i=0;
i<files.length;
i++
){

if(
daftar.length >= 6
){

pesan(
"Maksimal 6 foto per toko",
"error"
);

break;

}


if(
files[i].type.startsWith("image/")
){

daftar.push(
files[i]
);

}

}


preview(kode);

}


/* =====================================================
   PREVIEW
===================================================== */

function preview(kode){

const daftar =
FOTO[kode];


const tempat =
document.getElementById(
`preview-${kode}`
);


const info =
document.getElementById(
`info-${kode}`
);


tempat.innerHTML="";


if(
daftar.length < 3
){

info.textContent =
`⚠️ ${daftar.length} foto — minimal 3 foto`;

info.style.color="#dc2626";

}
else{

info.textContent =
`✅ ${daftar.length} foto siap disimpan`;

info.style.color="#16a34a";

}


daftar.forEach(
function(file,index){

const box =
document.createElement("div");

box.className="preview-box";


const img =
document.createElement("img");


const reader =
new FileReader();


reader.onload =
function(e){

img.src=e.target.result;

};


reader.readAsDataURL(file);


const hapus =
document.createElement("button");

hapus.className=
"delete-photo";

hapus.textContent="×";


hapus.onclick =
function(){

FOTO[kode].splice(
index,
1
);

preview(kode);

};


box.appendChild(img);

box.appendChild(hapus);

tempat.appendChild(box);

}
);

}


/* =====================================================
   KOMPRES FOTO
===================================================== */

function kompres(file){

return new Promise(
function(resolve,reject){

const reader =
new FileReader();


reader.onload =
function(e){

const img =
new Image();


img.onload =
function(){

const max=1200;

let w=img.width;

let h=img.height;


if(w>max){

h =
h*max/w;

w=max;

}


const canvas =
document.createElement(
"canvas"
);

canvas.width=w;

canvas.height=h;


const ctx =
canvas.getContext("2d");


ctx.drawImage(
img,
0,
0,
w,
h
);


resolve(
canvas.toDataURL(
"image/jpeg",
0.70
)
);

};


img.onerror=reject;

img.src=e.target.result;

};


reader.onerror=reject;

reader.readAsDataURL(file);

}
);

}


/* =====================================================
   SIMPAN ONLINE
===================================================== */

async function simpan(kode,nama){

const daftar =
FOTO[kode];


const tombol =
document.getElementById(
`save-${kode}`
);


const status =
document.getElementById(
`status-${kode}`
);


if(
daftar.length < 3
){

pesan(
`${kode}/${nama}: minimal 3 foto`,
"error"
);

return;

}


if(
daftar.length > 6
){

pesan(
`${kode}/${nama}: maksimal 6 foto`,
"error"
);

return;

}


const tanggal =
document.getElementById(
"tanggal"
).value;


tombol.disabled=true;

tombol.textContent =
"⏳ MENYIMPAN...";

status.textContent="⏳";


pesan(
`Mengirim ${kode}/${nama}...`,
"loading"
);


try{


/* KONVERSI FOTO */

const foto=[];


for(
let i=0;
i<daftar.length;
i++
){

const hasil =
await kompres(
daftar[i]
);

foto.push(hasil);

}


/* DATA */

const data={

tanggal:tanggal,

area:"TRIYANTO",

tokoPic:"KUTN",

kodeToko:kode,

namaToko:nama,

status:"✅",

foto:foto

};


/* KIRIM KE APPS SCRIPT */

await fetch(
API_URL,
{

method:"POST",

mode:"no-cors",

headers:{
"Content-Type":
"text/plain;charset=utf-8"
},

body:
JSON.stringify(data)

}
);


/* BERHASIL TERKIRIM */

status.textContent="✅";

tombol.textContent =
"✅ DATA TERKIRIM";

tombol.style.background =
"#16a34a";


SUDAH_SIMPAN.add(kode);

updateProgress();


pesan(
`${kode}/${nama} berhasil dikirim`,
"success"
);


}catch(error){


console.error(error);


status.textContent="❌";

tombol.disabled=false;

tombol.textContent =
"💾 COBA SIMPAN LAGI";


pesan(
`${kode}/${nama}: ${error.message}`,
"error"
);

}

}


/* =====================================================
   UPDATE PROGRESS
===================================================== */

function updateProgress(){

const jumlah =
SUDAH_SIMPAN.size;


document.getElementById(
"progressText"
).textContent =
`${jumlah} / 20 toko tersimpan`;


document.getElementById(
"progressBar"
).style.width =
`${jumlah/20*100}%`;

}


/* =====================================================
   WHATSAPP
===================================================== */

function whatsapp(kode,nama){

const tanggal =
document.getElementById(
"tanggal"
).value;


const jumlah =
FOTO[kode].length;


const teks =
`*REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO*

*AREA : TRIYANTO*
*PER TGL : ${tanggal}*
*TOKO PIC : KUTN*

${kode}/${nama}/✅

Jumlah foto: ${jumlah} foto`;


window.open(
"https://wa.me/?text="+
encodeURIComponent(teks),
"_blank"
);

}


/* =====================================================
   MULAI
===================================================== */

tampilkanToko();

</script>

</body>
</html>
