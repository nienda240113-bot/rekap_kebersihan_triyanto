<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Rekap Kebersihan Triyanto</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#111827;
}

header{
  background:#0f766e;
  color:white;
  padding:18px 14px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:20px;
}

header p{
  margin:5px 0 0;
  font-size:14px;
}

.container{
  max-width:700px;
  margin:auto;
  padding:12px;
}

.info{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.info b{
  display:block;
  margin-bottom:7px;
}

.store{
  background:white;
  border-radius:14px;
  margin-bottom:15px;
  padding:15px;
  box-shadow:0 2px 8px #0001;
}

.store-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.store-title h3{
  margin:0;
  font-size:17px;
}

.status{
  font-size:22px;
}

.photo-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.photo-buttons button{
  border:0;
  border-radius:10px;
  padding:13px 5px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.camera-btn{
  background:#2563eb;
  color:white;
}

.gallery-btn{
  background:#7c3aed;
  color:white;
}

.count{
  font-size:13px;
  margin-top:10px;
  font-weight:bold;
}

.preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:10px;
}

.preview-item{
  position:relative;
}

.preview img{
  width:100%;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  background:#ddd;
}

.remove-photo{
  position:absolute;
  top:4px;
  right:4px;
  width:25px;
  height:25px;
  border-radius:50%;
  border:0;
  background:#dc2626;
  color:white;
  font-size:14px;
  font-weight:bold;
  padding:0;
}

.save{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:#0f766e;
  color:white;
  margin-top:12px;
}

.save:disabled{
  background:#94a3b8;
}

.whatsapp{
  width:100%;
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  background:#16a34a;
  color:white;
  margin-top:8px;
}

.top{
  background:white;
  padding:12px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0001;
}

.progress{
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#0f766e;
  transition:.3s;
}

.result{
  position:fixed;
  left:10px;
  right:10px;
  bottom:10px;
  padding:14px;
  border-radius:10px;
  color:white;
  text-align:center;
  font-weight:bold;
  display:none;
  z-index:999;
}

.success{
  background:#16a34a;
}

.error{
  background:#dc2626;
}

.loading{
  background:#2563eb;
}

input[type=date]{
  width:100%;
  padding:11px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}
</style>
</head>

<body>

<header>

<h1>
REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO
</h1>

<p>AREA : TRIYANTO</p>
<p>TOKO PIC : KUTN</p>

</header>


<div class="container">


<div class="info">

<b>Tanggal</b>

<input
  id="tanggal"
  type="date">

</div>


<div class="top">

<b>Progress Penyimpanan</b>

<div id="progressText">
0 / 20 toko tersimpan
</div>

<div class="progress">

<div
  class="progress-bar"
  id="progressBar">
</div>

</div>

</div>


<div id="stores"></div>


</div>


<div
  id="result"
  class="result">
</div>


<script>


/* =========================================
   URL DATABASE GOOGLE APPS SCRIPT
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzyrkzoISeGTCSffRNOAtn8Dt_xfEJVxH6qdi49grTXhf9Fyge5groxSk07cZ8zV4rN/exec";

/* =========================================
   DAFTAR 20 TOKO
========================================= */

const TOKO = [

["C624","RWBT"],
["C560","RAJ"],
["CH81","CDKS"],
["CG76","SPMM"],
["C573","GMM"],
["CE47","MKRI"],
["CI30","STTD"],
["CH41","KPMRK"],
["CG54","MM2100"],
["C935","TLJ2"],
["CA71","WSGN"],
["C965","CBNU"],
["CG86","JKST"],
["CA94","KPTI"],
["C574","SKU"],
["CI15","RPSU"],
["CI54","RJLB"],
["CF50","DNIA"],
["CC21","KUTN"],
["CI84","TLKW"]

];


/* =========================================
   PENYIMPANAN FOTO SETIAP TOKO
========================================= */

const FOTO_TOKO = {};


/* =========================================
   TANGGAL OTOMATIS
========================================= */

const today = new Date();

document.getElementById("tanggal").value =
today.getFullYear() +
"-" +
String(today.getMonth()+1).padStart(2,"0") +
"-" +
String(today.getDate()).padStart(2,"0");


/* =========================================
   PESAN
========================================= */

function showMessage(text,type){

  const el =
  document.getElementById("result");

  el.textContent=text;

  el.className=
  "result "+type;

  el.style.display="block";

  if(type!=="loading"){

    setTimeout(function(){

      el.style.display="none";

    },4000);

  }

}


/* =========================================
   BUAT 20 TOKO
========================================= */

function renderStores(){

  const container =
  document.getElementById("stores");

  container.innerHTML="";


  TOKO.forEach(function(toko,index){

    const kode=toko[0];

    const nama=toko[1];


    FOTO_TOKO[kode]=[];


    const div=
    document.createElement("div");

    div.className="store";


    div.innerHTML=`

      <div class="store-title">

        <h3>
        ${index+1}. ${kode}/${nama}
        </h3>

        <span
        class="status"
        id="status-${kode}">
        ⏳
        </span>

      </div>


      <div class="photo-buttons">

        <button
        type="button"
        class="camera-btn"
        onclick="bukaKamera('${kode}')">

        📷 Ambil Foto

        </button>


        <button
        type="button"
        class="gallery-btn"
        onclick="bukaGaleri('${kode}')">

        🖼️ Pilih dari Galeri

        </button>

      </div>


      <input
      type="file"
      id="kamera-${kode}"
      accept="image/*"
      capture="environment"
      hidden>


      <input
      type="file"
      id="galeri-${kode}"
      accept="image/*"
      multiple
      hidden>


      <div
      class="count"
      id="count-${kode}">

      Belum ada foto — wajib 3–6 foto

      </div>


      <div
      class="preview"
      id="preview-${kode}">
      </div>


      <button
      class="save"
      id="save-${kode}"
      onclick="simpanToko('${kode}','${nama}')">

      💾 SIMPAN ONLINE

      </button>


      <button
      class="whatsapp"
      onclick="shareWhatsApp('${kode}','${nama}')">

      📲 KIRIM WHATSAPP

      </button>

    `;


    container.appendChild(div);


    document
    .getElementById(`kamera-${kode}`)
    .addEventListener(
      "change",
      function(){

        tambahFoto(
          kode,
          this.files
        );

        this.value="";

      }
    );


    document
    .getElementById(`galeri-${kode}`)
    .addEventListener(
      "change",
      function(){

        tambahFoto(
          kode,
          this.files
        );

        this.value="";

      }
    );

  });

}


/* =========================================
   BUKA KAMERA
========================================= */

function bukaKamera(kode){

  const input =
  document.getElementById(
    `kamera-${kode}`
  );

  input.click();

}


/* =========================================
   BUKA GALERI
========================================= */

function bukaGaleri(kode){

  const input =
  document.getElementById(
    `galeri-${kode}`
  );

  input.click();

}


/* =========================================
   TAMBAH FOTO
========================================= */

function tambahFoto(kode,files){

  const daftar=
  FOTO_TOKO[kode];


  for(let i=0;i<files.length;i++){

    if(daftar.length>=6){

      showMessage(
        "Maksimal 6 foto",
        "error"
      );

      break;

    }

    const file=files[i];


    if(!file.type.startsWith("image/")){

      continue;

    }


    daftar.push(file);

  }


  renderPreview(kode);

}


/* =========================================
   PREVIEW FOTO
========================================= */

function renderPreview(kode){

  const daftar=
  FOTO_TOKO[kode];


  const preview=
  document.getElementById(
    `preview-${kode}`
  );


  const count=
  document.getElementById(
    `count-${kode}`
  );


  preview.innerHTML="";


  if(daftar.length===0){

    count.textContent=
    "Belum ada foto — wajib 3–6 foto";

    count.style.color="#dc2626";

    return;

  }


  if(daftar.length<3){

    count.textContent=
    `⚠️ ${daftar.length} foto — minimal 3`;

    count.style.color="#dc2626";

  }

  else{

    count.textContent=
    `✅ ${daftar.length} foto siap disimpan`;

    count.style.color="#16a34a";

  }


  daftar.forEach(function(file,index){

    const item=
    document.createElement("div");

    item.className=
    "preview-item";


    const img=
    document.createElement("img");


    const reader=
    new FileReader();


    reader.onload=
    function(e){

      img.src=e.target.result;

    };


    reader.readAsDataURL(file);


    const remove=
    document.createElement("button");

    remove.className=
    "remove-photo";

    remove.textContent="×";


    remove.onclick=
    function(){

      FOTO_TOKO[kode].splice(
        index,
        1
      );

      renderPreview(kode);

    };


    item.appendChild(img);

    item.appendChild(remove);

    preview.appendChild(item);

  });

}


/* =========================================
   KOMPRES FOTO
========================================= */

function resizeImage(file){

  return new Promise(function(resolve,reject){

    const reader=
    new FileReader();


    reader.onload=
    function(e){

      const img=
      new Image();


      img.onload=
      function(){

        const maxWidth=1200;


        let width=img.width;

        let height=img.height;


        if(width>maxWidth){

          height=
          height*maxWidth/width;

          width=maxWidth;

        }


        const canvas=
        document.createElement("canvas");


        canvas.width=width;

        canvas.height=height;


        const ctx=
        canvas.getContext("2d");


        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );


        resolve(
          canvas.toDataURL(
            "image/jpeg",
            0.70
          )
        );

      };


      img.onerror=reject;

      img.src=e.target.result;

    };


    reader.onerror=reject;

    reader.readAsDataURL(file);

  });

}


/* =========================================
   SIMPAN TOKO
========================================= */

async function simpanToko(kode,nama){

  const files=
  FOTO_TOKO[kode];


  const button=
  document.getElementById(
    `save-${kode}`
  );


  const status=
  document.getElementById(
    `status-${kode}`
  );


  if(files.length<3){

    showMessage(
      `${kode}/${nama}: minimal 3 foto`,
      "error"
    );

    return;

  }


  if(files.length>6){

    showMessage(
      `${kode}/${nama}: maksimal 6 foto`,
      "error"
    );

    return;

  }


  const tanggal=
  document.getElementById(
    "tanggal"
  ).value;


  if(!tanggal){

    showMessage(
      "Tanggal belum dipilih",
      "error"
    );

    return;

  }


  button.disabled=true;

  button.textContent=
  "⏳ MENYIMPAN...";


  status.textContent="⏳";


  showMessage(
    `Mengirim ${kode}/${nama}...`,
    "loading"
  );


  try{

    const foto=[];


    for(
      let i=0;
      i<files.length;
      i++
    ){

      const compressed=
      await resizeImage(
        files[i]
      );

      foto.push(compressed);

    }


    const data={

      tanggal:tanggal,

      area:"TRIYANTO",

      tokoPic:"KUTN",

      kodeToko:kode,

      namaToko:nama,

      status:"✅",

      foto:foto

    };


    const response=
    await fetch(
      API_URL,
      {
        method:"POST",

        headers:{
          "Content-Type":
          "text/plain;charset=utf-8"
        },

        body:
        JSON.stringify(data)
      }
    );


    const result=
    await response.json();


    if(!result.success){

      throw new Error(
        result.message ||
        "Gagal menyimpan"
      );

    }


    status.textContent="✅";


    button.textContent=
    "✅ SUDAH TERSIMPAN";


    button.style.background=
    "#16a34a";


    showMessage(
      `${kode}/${nama} berhasil disimpan online`,
      "success"
    );


    updateProgress();


  }catch(error){

    console.error(error);


    status.textContent="❌";


    button.disabled=false;


    button.textContent=
    "💾 COBA SIMPAN LAGI";


    showMessage(
      `${kode}/${nama}: ${error.message}`,
      "error"
    );

  }

}


/* =========================================
   PROGRESS
========================================= */

let savedStores=new Set();


function updateProgress(){

  TOKO.forEach(function(toko){

    const kode=toko[0];

    const status=
    document.getElementById(
      `status-${kode}`
    );

    const button=
    document.getElementById(
      `save-${kode}`
    );


    if(
      status &&
      status.textContent==="✅" &&
      button &&
      button.textContent.includes(
        "SUDAH TERSIMPAN"
      )
    ){

      savedStores.add(kode);

    }

  });


  const jumlah=
  savedStores.size;


  document.getElementById(
    "progressText"
  ).textContent=
  `${jumlah} / 20 toko tersimpan`;


  document.getElementById(
    "progressBar"
  ).style.width=
  `${jumlah/20*100}%`;

}


/* =========================================
   WHATSAPP
========================================= */

function shareWhatsApp(kode,nama){

  const tanggal=
  document.getElementById(
    "tanggal"
  ).value;


  const jumlah=
  FOTO_TOKO[kode].length;


  const text=
`*REKAP AKTIVITAS KEBERSIHAN HARIAN TOKO*

*AREA : TRIYANTO*
*PER TGL : ${tanggal}*
*TOKO PIC : KUTN*

${kode}/${nama}/✅

Jumlah foto: ${jumlah} foto`;


  const url=
  "https://wa.me/?text="+
  encodeURIComponent(text);


  window.open(
    url,
    "_blank"
  );

}


/* =========================================
   JALANKAN
========================================= */

renderStores();

</script>

</body>
  </html>
